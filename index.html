<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团购收款看板</title>
<style>
  :root {
    --bg: #efe7d8;
    --paper: #fffcf6;
    --ink: #2b2420;
    --muted: #8a7f6e;
    --line: #ddd2bd;
    --red: #b5482a;
    --green: #5c7a5e;
    --green-btn: #4f7f5b;
    --warn-bg: #fdf0d5;
    --warn-border: #e0a838;
    --warn-text: #8a5a00;
    --warn-tag-bg: #e0a838;
    --warn-tag-text: #3a2800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --paper: #262019;
      --ink: #f1e9dd;
      --muted: #a99d8c;
      --line: #3d352c;
      --red: #e08064;
      --green: #8fbb96;
      --green-btn: #4f7f5b;
      --warn-bg: #3a2f10;
      --warn-border: #caa23a;
      --warn-text: #f0c869;
      --warn-tag-bg: #caa23a;
      --warn-tag-text: #2a1f00;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    margin: 0;
    padding: 20px 14px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .page { max-width: 480px; margin: 0 auto; }

  @media (min-width: 860px) {
    .page { max-width: 760px; }
    .ticket { padding: 20px 24px 8px; }
    #rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #rows .row { margin-bottom: 0; }
    .flavorGrid { max-width: 460px; }
  }

  .shopHead { text-align: center; margin-bottom: 18px; }
  .debugBanner {
    background: #222; color: #f88; font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; padding: 8px 10px; border-radius: 6px; margin: 0 0 14px;
    word-break: break-all; line-height: 1.5;
  }
  .shopName {
    font-family: Georgia, "Iowan Old Style", "Songti SC", serif;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin: 0;
  }

  .buyTabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .buyTab {
    padding: 7px 16px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: var(--paper); color: var(--muted);
    border-radius: 20px; cursor: pointer; user-select: none;
  }
  .buyTab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .ticket, .card {
    background: var(--paper);
    border-radius: 4px;
    border: 1px solid var(--line);
    padding: 16px 16px 4px;
    margin-bottom: 16px;
  }
  .card { padding: 16px 16px 18px; }
  .card .sectionTitle { margin-top: 0; }
  .statRow { display: flex; justify-content: space-between; padding: 10px 0; }
  .statRow + .statRow { border-top: 1px dashed var(--line); }
  .statRow.unitRow { cursor: pointer; }
  .statRow.unitRow:active { opacity: 0.7; }
  .unitChevron { color: var(--muted); margin-left: 4px; font-size: 15px; }
  .statLabel { font-size: 13px; color: var(--muted); }

  .unitOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .unitOverlayCard {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 18px 16px; max-width: 380px; width: 100%; max-height: 80vh;
    overflow-y: auto; box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }
  .statValue { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; }
  .statValue.big { font-size: 19px; }
  .statValue.green { color: var(--green); }
  .statValue.red { color: var(--red); }

  .progressTrack { height: 6px; background: var(--line); border-radius: 3px; margin: 2px 0 6px; overflow: hidden; }
  .progressFill { height: 100%; background: var(--green); transition: width 0.3s ease; }
  .progressLabel { font-size: 12px; color: var(--muted); padding-bottom: 14px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0; font-size: 13px;
    border: 1px solid var(--line); background: var(--paper); color: var(--muted);
    border-radius: 6px; cursor: pointer; user-select: none;
  }
  .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .row {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 18px 18px 16px; margin-bottom: 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .rowHead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .rowName { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .itemLine {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 14px; color: var(--muted); padding: 4px 0;
  }
  .itemLine .itemAmt { font-family: "SF Mono", Menlo, Consolas, monospace; flex-shrink: 0; }
  .itemLine.adjustment { font-style: italic; }
  .itemLine.adjustment .itemAmt { display: flex; align-items: center; gap: 6px; font-style: normal; }
  .adjUndo {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px; color: var(--red); cursor: pointer; text-decoration: underline;
    font-style: normal;
  }
  .rowTotalLine {
    display: flex; justify-content: space-between;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 16px; font-weight: 700;
  }
  .rowTotalLine .rowTotalAmt { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .payBtn {
    font-size: 12.5px; padding: 6px 13px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    cursor: pointer; user-select: none; display: inline-block; flex-shrink: 0;
  }
  .payBtn.on { background: var(--green-btn); border-color: var(--green-btn); color: white; }

  .itemLine.unverified {
    color: var(--warn-text);
    background: var(--warn-bg);
    border-radius: 4px;
    padding: 2px 6px;
    font-weight: 600;
  }
  .unverifiedTag, .walkinTag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
  }
  .unverifiedTag { background: var(--warn-tag-bg); color: var(--warn-tag-text); }
  .walkinTag { background: var(--line); color: var(--muted); }
  .warnBanner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .sectionTitle {
    font-family: Georgia, serif; font-size: 16px; margin: 22px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .flavorGrid { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; font-size: 13px; }
  .flavorGrid .h { color: var(--muted); font-size: 11px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .flavorQty, .flavorAmt { font-family: "SF Mono", Menlo, Consolas, monospace; text-align: right; }
  .flavorAmt { color: var(--muted); }
  .grandTotalBlock {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ink);
  }
  .grandTotalRow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 700; font-size: 14px;
  }
  .grandTotalAmt { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .grandTotalQty {
    font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--muted);
    text-align: center; margin-top: 6px; font-size: 12.5px; line-height: 1.7;
  }

  .toolbar {
    display: flex; gap: 8px; justify-content: center; margin: 22px 0 4px; flex-wrap: wrap;
  }
  .toolBtn {
    font-size: 12px; padding: 7px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    cursor: pointer;
  }
  .footNote { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

  .adjAddBtn {
    display: inline-block; font-size: 12px; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 10px; padding: 3px 10px;
    margin-top: 8px; cursor: pointer; user-select: none;
  }
  .copyMsgBtn {
    display: inline-block; font-size: 12.5px; color: var(--ink);
    border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
    padding: 5px 12px; margin-top: 8px; margin-right: 6px;
    cursor: pointer; user-select: none;
  }
  .copyMsgBtn.copied { background: var(--green-btn); border-color: var(--green-btn); color: white; }
  .adjForm {
    margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px;
    background: var(--bg); font-size: 13px;
  }
  .adjForm input:not([type="radio"]), .adjForm select, .bulkPanel textarea {
    width: 100%; margin-bottom: 8px; padding: 7px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 13px; box-sizing: border-box; font-family: inherit;
  }
  .adjFormRow input[type="radio"] {
    width: auto; margin: 0; padding: 0; flex-shrink: 0;
  }
  .bulkPanel textarea {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; min-height: 100px;
  }
  .adjFormRow { display: flex; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12.5px; }
  .adjFormRow label {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    white-space: nowrap; flex: 0 0 auto;
  }
  .adjFormBtns { display: flex; gap: 8px; }
  .adjError { color: var(--red); font-size: 12px; margin: 2px 0 8px; }
  .pinRow { display: flex; gap: 8px; justify-content: center; margin: 4px 0 6px; }
  .pinRow input { width: 140px; }

  /* Print gets its own dense table layout (see renderPrintSection) instead of
     reusing the on-screen cards, which ran to many pages per round. */
  .printOnly { display: none; }
  @media print {
    body { background: #fff; padding: 8px; color: #000; }
    .page > *:not(.printOnly) { display: none !important; }
    .printOnly { display: block !important; }
    .printOnly .shopName { font-size: 18px; margin-bottom: 2px; }
    .printMeta { text-align: center; font-size: 11px; color: #333; margin-bottom: 10px; }
    .printWarn { font-size: 10.5px; color: #7a5200; margin-bottom: 8px; text-align: center; }
    .printSectionTitle { font-weight: 700; font-size: 12.5px; margin: 10px 0 4px; }
    .printTable { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    .printTable th, .printTable td { border-bottom: 1px solid #ccc; padding: 2.5px 5px; text-align: left; vertical-align: top; }
    .printTable th { font-weight: 700; border-bottom: 1.5px solid #000; }
    .printTable tfoot td { font-weight: 700; border-top: 1.5px solid #000; border-bottom: none; }
    .printAmt { text-align: right; font-family: "SF Mono", Menlo, Consolas, monospace; white-space: nowrap; }
    .printStatus { text-align: center; white-space: nowrap; }
  }
</style>
</head>
<body>
  <div class="page" id="app"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmfejtmHiICRpYbQsnSGfzDrq7qkWendo",
      authDomain: "wg-group-buy.firebaseapp.com",
      projectId: "wg-group-buy",
      storageBucket: "wg-group-buy.firebasestorage.app",
      messagingSenderId: "373350678794",
      appId: "1:373350678794:web:4308b6043bd5c74f64baf3"
    };
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    // Soft gate only — Firestore rules stay open to anyone with the link (same
    // trust model as paid-status today). This just stops accidental taps.
    // Change this before sharing the link if you want a different passcode.
    const EDIT_PIN = "1117";

    const MANIFEST_URL = "./manifest.json";
    // Keyword -> emoji lookup for product labels (see product-emoji-map.json).
    // Loaded in parallel with the group-buy data; falls back to a plain
    // shopping-cart icon for anything unmatched or while it's still loading.
    const EMOJI_MAP_URL = "./product-emoji-map.json";
    let EMOJI_MAP = { defaultEmoji: "🛒", categories: [] };
    let GROUP_BUYS = [];
    let activeIndex = 0;
    let DATA = null;
    let paidState = {};
    let adjustments = {}; // { entryId: { member, type, itemKey?, qtyDelta?, amountDelta, note, ts } }
    let filter = "all";
    let openUnit = null; // which unit's detail overlay is currently open, if any
    let copiedFor = null; // member name whose WeChat message was just copied, for transient "已复制" feedback

    let editUnlocked = false;
    try { editUnlocked = localStorage.getItem("wg_edit_unlocked") === "1"; } catch (e) {}
    let editMode = false;
    let showPinInput = false;
    let pinError = "";
    let pinDraft = "";
    let openAdjustFormFor = null; // a member name, "__walkin__", or null
    let adjFormType = "item";
    let adjFormError = "";
    // Draft values for the currently-open adjustment form. Kept in JS state
    // (not just read from the DOM at submit time) so an in-progress edit
    // survives a re-render triggered by someone else's live update arriving
    // via Firestore mid-edit, or by switching the item/credit radio.
    let adjDraft = { name: "", itemKey: "", qtyDelta: "", amount: "", note: "" };
    let showBulkPanel = false;
    let bulkError = "";
    let bulkDraft = "";

    let unsubscribePaidState = null;
    let unsubscribeAdjustments = null;
    let storageDebug = ""; // shows a Firestore error inline, if any — no console access needed

    function paidDocRef(dateKey) {
      return doc(db, "paidStatus", dateKey);
    }
    function adjustmentsDocRef(dateKey) {
      return doc(db, "adjustments", dateKey);
    }

    function escapeHtml(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function resetAdjDraft() {
      adjDraft = { name: "", itemKey: "", qtyDelta: "", amount: "", note: "" };
      adjFormType = "item";
      adjFormError = "";
    }

    // Looks up the best-matching emoji for a product's Chinese label by
    // checking EMOJI_MAP.categories in order and returning the first
    // category whose keywords list contains a substring of the label.
    function productEmoji(label) {
      const cats = EMOJI_MAP.categories || [];
      for (const cat of cats) {
        if ((cat.keywords || []).some(kw => label.includes(kw))) return cat.emoji;
      }
      return EMOJI_MAP.defaultEmoji || "🛒";
    }
    // Product label prefixed with its looked-up emoji, for display only —
    // never used for the underlying data/keys.
    function emojiLabel(info) {
      return `${productEmoji(info.label)} ${info.label}`;
    }

    // Subscribes to live updates for this group buy's paid status. Every
    // change — from this browser or anyone else's — re-renders automatically,
    // so the dashboard stays in sync across everyone with the link.
    function subscribeToPaidState(dateKey) {
      if (unsubscribePaidState) { unsubscribePaidState(); unsubscribePaidState = null; }
      unsubscribePaidState = onSnapshot(
        paidDocRef(dateKey),
        (snap) => {
          paidState = snap.exists() ? snap.data() : {};
          storageDebug = "";
          render();
        },
        (err) => {
          storageDebug = `Firestore 读取出错：${err.message}`;
          paidState = {};
          render();
        }
      );
    }

    // Same live-sync pattern as paid status, for delivery-day adjustments
    // (shortages, refunds, walk-in extras) — see adjustmentsForMember().
    function subscribeToAdjustments(dateKey) {
      if (unsubscribeAdjustments) { unsubscribeAdjustments(); unsubscribeAdjustments = null; }
      unsubscribeAdjustments = onSnapshot(
        adjustmentsDocRef(dateKey),
        (snap) => {
          adjustments = snap.exists() ? snap.data() : {};
          render();
        },
        (err) => {
          storageDebug = `调整记录读取出错：${err.message}`;
          adjustments = {};
          render();
        }
      );
    }

    // Writes just the one member's field, so two people tapping different
    // rows at the same time can't clobber each other's change.
    async function togglePaid(dateKey, name) {
      try {
        await setDoc(paidDocRef(dateKey), { [name]: !paidState[name] }, { merge: true });
      } catch (e) {
        storageDebug = `保存出错：${e.message}`;
        render();
      }
    }

    function newEntryId(salt) {
      return `${Date.now()}_${salt != null ? salt + "_" : ""}${Math.random().toString(36).slice(2, 8)}`;
    }

    async function saveAdjustment(dateKey, entry) {
      try {
        await setDoc(adjustmentsDocRef(dateKey), { [newEntryId()]: entry }, { merge: true });
      } catch (e) {
        storageDebug = `调整保存出错：${e.message}`;
        render();
      }
    }

    async function deleteAdjustment(dateKey, id) {
      try {
        await setDoc(adjustmentsDocRef(dateKey), { [id]: deleteField() }, { merge: true });
      } catch (e) {
        storageDebug = `调整删除出错：${e.message}`;
        render();
      }
    }

    async function bulkApplyAdjustments(dateKey, entries) {
      const patch = {};
      entries.forEach((entry, i) => { patch[newEntryId(i)] = entry; });
      try {
        await setDoc(adjustmentsDocRef(dateKey), patch, { merge: true });
      } catch (e) {
        storageDebug = `批量调整出错：${e.message}`;
        render();
      }
    }

    function cost(items) {
      return Object.entries(items).reduce(
        (sum, [key, qty]) => sum + (DATA.products[key] ? DATA.products[key].price * qty : 0), 0
      );
    }
    function unitOf(key) {
      return (DATA.products[key] && DATA.products[key].unit) || "盒";
    }
    function isUnverified(key) {
      return !!(DATA.products[key] && DATA.products[key].unverified);
    }
    function countUnverifiedLines(members) {
      let n = 0;
      members.forEach(m => Object.keys(m.items).forEach(k => { if (isUnverified(k)) n++; }));
      return n;
    }

    // All adjustment entries for one member, oldest first.
    function adjustmentsForMember(name) {
      return Object.entries(adjustments)
        .filter(([id, e]) => e.member === name)
        .map(([id, e]) => ({ id, ...e }))
        .sort((a, b) => (a.ts || 0) - (b.ts || 0));
    }
    // Net dollar effect of a member's adjustments (shortages/refunds/extras).
    function adjustmentTotal(name) {
      return adjustmentsForMember(name).reduce((s, a) => s + (a.amountDelta || 0), 0);
    }
    // A member's original items plus item-type adjustment deltas — used for
    // procurement totals (stocking list, unit totals), never for money, since
    // money is always base cost + amountDelta (frozen at adjustment time).
    function effectiveItems(m) {
      const out = { ...m.items };
      adjustmentsForMember(m.name).forEach(a => {
        if (a.type === "item" && a.itemKey) {
          out[a.itemKey] = (out[a.itemKey] || 0) + a.qtyDelta;
          if (!out[a.itemKey]) delete out[a.itemKey];
        }
      });
      return out;
    }

    // Builds the plain-text WeChat message for one member — their itemized
    // order, any shortage/refund/extra adjustments (with the reason, so the
    // total doesn't look arbitrary), and the final amount due. Meant to be
    // copied and pasted straight into a WeChat DM or the group chat; never
    // sent automatically, so it's fine if the organizer wants to hand-edit
    // it (e.g. to append payment/QR info) before sending.
    function buildMemberMessage(m) {
      const gb = GROUP_BUYS[activeIndex];
      const lines = [];
      lines.push(`【${DATA.groupName || "团购"}】${gb ? (gb.label || gb.date) : ""}`);
      lines.push(`${m.name} 你好，你的订单：`);
      Object.entries(m.items).forEach(([k, qty]) => {
        const info = DATA.products[k];
        if (!info) return;
        const unverified = isUnverified(k);
        const amtText = unverified ? "待确认" : `$${(info.price * qty).toFixed(2)}`;
        lines.push(`${emojiLabel(info)} x${formatQty(qty)}${unitOf(k)} ${amtText}${unverified ? "（缺失/待确认）" : ""}`);
      });
      adjustmentsForMember(m.name).forEach(a => {
        const sign = a.amountDelta >= 0 ? "+" : "";
        if (a.type === "item" && a.itemKey && DATA.products[a.itemKey]) {
          const info = DATA.products[a.itemKey];
          const qtySign = a.qtyDelta >= 0 ? "+" : "";
          lines.push(`↳ ${emojiLabel(info)} ${qtySign}${formatQty(a.qtyDelta)}${unitOf(a.itemKey)}${a.note ? `（${a.note}）` : ""} ${sign}$${a.amountDelta.toFixed(2)}`);
        } else {
          lines.push(`↳ ${a.note || "退款/补款"} ${sign}$${a.amountDelta.toFixed(2)}`);
        }
      });
      lines.push(`合计：$${m.total.toFixed(2)}`);
      lines.push(paidState[m.name] ? "已收到你的付款，谢谢！🙏" : "麻烦付款哈，谢谢！🙏");
      return lines.join("\n");
    }

    // navigator.clipboard needs a secure context + user gesture, both true
    // here (GitHub Pages is https, this runs from a tap), but falls back to
    // the old textarea+execCommand trick for any browser that lacks it.
    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopyToClipboard(text));
      }
      return Promise.resolve(legacyCopyToClipboard(text));
    }
    function legacyCopyToClipboard(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    // Sums quantities per unit type (e.g. {"盒": 45, "kg": 3.5}) instead of
    // blindly adding boxes and kilos together into one meaningless number.
    function unitTotals(itemsList) {
      const totals = {};
      itemsList.forEach(items => {
        Object.entries(items).forEach(([key, qty]) => {
          const u = unitOf(key);
          totals[u] = (totals[u] || 0) + qty;
        });
      });
      return totals;
    }
    // Which distinct products contribute to each unit bucket, with their
    // quantities — used to power the tap-to-see-detail overlay instead of
    // crowding the summary card itself.
    function unitProductBreakdown(itemsList) {
      const map = {}; // unit -> { productKey: qty }
      itemsList.forEach(items => {
        Object.entries(items).forEach(([key, qty]) => {
          const u = unitOf(key);
          if (!DATA.products[key]) return;
          if (!map[u]) map[u] = {};
          map[u][key] = (map[u][key] || 0) + qty;
        });
      });
      return map;
    }
    function formatQty(qty) {
      // trims trailing zeros: 1.50 -> 1.5, 3.00 -> 3
      return Number(qty.toFixed(2)).toString();
    }
    function formatUnitTotals(totals) {
      return Object.entries(totals)
        .map(([u, qty]) => `${formatQty(qty)}${u}`)
        .join(" + ");
    }

    function loadGroupBuy(index) {
      activeIndex = index;
      const gb = GROUP_BUYS[index];
      fetch(gb.file)
        .then(r => r.json())
        .then(json => {
          DATA = json;
          filter = "all";
          openUnit = null;
          openAdjustFormFor = null;
          showBulkPanel = false;
          bulkError = "";
          bulkDraft = "";
          copiedFor = null;
          resetAdjDraft();
          subscribeToPaidState(gb.date);
          subscribeToAdjustments(gb.date);
        });
    }

    function adjustmentLineHtml(a) {
      const sign = a.amountDelta >= 0 ? "+" : "";
      let label;
      if (a.type === "item" && a.itemKey && DATA.products[a.itemKey]) {
        const info = DATA.products[a.itemKey];
        const qtySign = a.qtyDelta >= 0 ? "+" : "";
        label = `↳ ${emojiLabel(info)} ${qtySign}${formatQty(a.qtyDelta)}${unitOf(a.itemKey)}${a.note ? ` · ${escapeHtml(a.note)}` : ""}`;
      } else {
        label = `↳ ${escapeHtml(a.note || "退款/补款")}`;
      }
      return `
        <div class="itemLine adjustment">
          <span>${label}</span>
          <span class="itemAmt">${sign}$${a.amountDelta.toFixed(2)}${editMode ? ` <span class="adjUndo" data-id="${a.id}">撤销</span>` : ""}</span>
        </div>
      `;
    }

    function renderAdjForm(memberKey) {
      const isWalkin = memberKey === "__walkin__";
      const productKeys = Object.keys(DATA.products);
      const selectedItemKey = adjDraft.itemKey || productKeys[0] || "";
      return `
        <div class="adjForm">
          ${isWalkin ? `<input type="text" id="adjWalkinName" placeholder="买家姓名（现场加购、原本不在名单里的人）" value="${escapeHtml(adjDraft.name)}">` : ""}
          <div class="adjFormRow">
            <label><input type="radio" name="adjType" value="item" ${adjFormType === "item" ? "checked" : ""}> 品项数量变化</label>
            <label><input type="radio" name="adjType" value="credit" ${adjFormType === "credit" ? "checked" : ""}> 退款/补款（固定金额）</label>
          </div>
          ${adjFormType === "item" ? `
            <select id="adjItemKey">
              ${productKeys.map(k => {
                const info = DATA.products[k];
                return `<option value="${k}" ${k === selectedItemKey ? "selected" : ""}>${emojiLabel(info)}${info.price != null ? ` ($${info.price.toFixed(2)}/${info.unit || "盒"})` : ""}</option>`;
              }).join("")}
            </select>
            <input type="number" id="adjQtyDelta" placeholder="数量变化，例如 -1（少1份）或 2（多卖2份）" step="any" value="${escapeHtml(adjDraft.qtyDelta)}">
          ` : `
            <input type="number" id="adjAmount" placeholder="金额变化，例如 -6.5（退款）或 3（补款）" step="any" value="${escapeHtml(adjDraft.amount)}">
          `}
          <input type="text" id="adjNote" placeholder="备注，例如：到货少一份 / 现场加购" value="${escapeHtml(adjDraft.note)}">
          ${adjFormError ? `<div class="adjError">${adjFormError}</div>` : ""}
          <div class="adjFormBtns">
            <div class="toolBtn" id="adjSaveBtn" data-member="${memberKey}">保存</div>
            <div class="toolBtn" id="adjCancelBtn">取消</div>
          </div>
        </div>
      `;
    }

    function handleAdjSave(memberKey) {
      const isWalkin = memberKey === "__walkin__";
      const type = adjFormType;
      const note = (adjDraft.note || "").trim();
      let memberName = memberKey;
      if (isWalkin) {
        memberName = (adjDraft.name || "").trim();
        if (!memberName) { adjFormError = "请填写买家姓名"; render(); return; }
      }
      let entry;
      if (type === "item") {
        const itemKey = adjDraft.itemKey || Object.keys(DATA.products)[0];
        const qtyDelta = parseFloat(adjDraft.qtyDelta);
        if (!itemKey || isNaN(qtyDelta) || qtyDelta === 0) { adjFormError = "请填写有效的数量变化（不能是 0）"; render(); return; }
        const info = DATA.products[itemKey];
        const amountDelta = info && info.price != null ? info.price * qtyDelta : 0;
        entry = { member: memberName, type: "item", itemKey, qtyDelta, amountDelta, note, ts: Date.now() };
      } else {
        const amountDelta = parseFloat(adjDraft.amount);
        if (isNaN(amountDelta) || amountDelta === 0) { adjFormError = "请填写有效的金额（不能是 0）"; render(); return; }
        entry = { member: memberName, type: "credit", amountDelta, note, ts: Date.now() };
      }
      saveAdjustment(GROUP_BUYS[activeIndex].date, entry);
      openAdjustFormFor = null;
      resetAdjDraft();
      render();
    }

    function handleBulkApply() {
      let parsed;
      try { parsed = JSON.parse(bulkDraft); } catch (e) { bulkError = "JSON 解析失败：" + e.message; render(); return; }
      if (!Array.isArray(parsed)) { bulkError = "需要是一个 JSON 数组"; render(); return; }
      const cleaned = parsed
        .filter(e => e && e.member && typeof e.amountDelta === "number")
        .map(e => ({
          member: e.member,
          type: e.type === "credit" ? "credit" : "item",
          itemKey: e.itemKey,
          qtyDelta: e.qtyDelta,
          amountDelta: e.amountDelta,
          note: e.note || "",
          ts: Date.now()
        }));
      if (!cleaned.length) { bulkError = "没有找到有效的条目（每条至少需要 member 和 amountDelta）"; render(); return; }
      bulkApplyAdjustments(GROUP_BUYS[activeIndex].date, cleaned);
      bulkError = "";
      bulkDraft = "";
      showBulkPanel = false;
      render();
    }

    function handlePinSubmit() {
      if (pinDraft === EDIT_PIN) {
        editUnlocked = true;
        editMode = true;
        showPinInput = false;
        pinError = "";
        pinDraft = "";
        try { localStorage.setItem("wg_edit_unlocked", "1"); } catch (e) {}
      } else {
        pinError = "密码错误";
      }
      render();
    }

    function render() {

          ` : ""}
          <div class="statRow"><span class="statLabel">已收款</span><span class="statValue big green">$${collected.toFixed(2)}</span></div>
          <div class="statRow"><span class="statLabel">未收款</span><span class="statValue red">$${(grandTotal - collected).toFixed(2)}</span></div>
          <div style="padding-bottom:14px">
            <div class="progressTrack"><div class="progressFill" style="width:${grandTotal ? (collected/grandTotal*100) : 0}%"></div></div>
            <div class="progressLabel">已收 ${paidCount} / ${members.length} 人</div>

        <div class="tabs">

          <div class="tab ${filter === "unpaid" ? "active" : ""}" data-filter="unpaid">未付款</div>
          <div class="tab ${filter === "paid" ? "active" : ""}" data-filter="paid">已付款</div>
        </div>

        <div id="rows">
          ${visible.map(m => `
            <div class="row">
              <div class="rowHead">
                <div class="rowName">${m.name}${m.isWalkin ? '<span class="walkinTag">现场加购</span>' : ""}</div>
                <div class="payBtn ${paidState[m.name] ? "on" : ""}" data-name="${m.name}">${paidState[m.name] ? "已付款 ✓" : "标记已付款"}</div>
              </div>
              ${Object.entries(m.items).map(([k, qty]) => {
                const info = DATA.products[k];
                const unverified = isUnverified(k);
                const amtText = unverified ? "待确认" : `$${(info.price * qty).toFixed(2)}`;
                return `<div class="itemLine${unverified ? " unverified" : ""}"><span>${emojiLabel(info)} x${formatQty(qty)}${unitOf(k)}${unverified ? '<span class="unverifiedTag">缺失/待确认</span>' : ""}</span><span class="itemAmt">${amtText}</span></div>`;
              }).join("")}
              ${adjustmentsForMember(m.name).map(a => adjustmentLineHtml(a)).join("")}
              <div class="rowTotalLine"><span>合计</span><span class="rowTotalAmt">$${m.total.toFixed(2)}</span></div>
              <div class="copyMsgBtn${copiedFor === m.name ? " copied" : ""}" data-name="${m.name}">${copiedFor === m.name ? "已复制 ✓" : "💬 复制付款消息"}</div>
              ${editMode ? `<div class="adjAddBtn" data-member="${m.name}">${openAdjustFormFor === m.name ? "取消调整" : "+ 调整"}</div>` : ""}
              ${editMode && openAdjustFormFor === m.name ? renderAdjForm(m.name) : ""}
            </div>
          `).join("")}
        </div>

        ${editMode && openAdjustFormFor === "__walkin__" ? `<div class="row">${renderAdjForm("__walkin__")}</div>` : ""}

        <div class="card">
          <div class="sectionTitle">备货清单 — 各口味所需数量</div>
          <div class="footNote" style="text-align:left;margin:-6px 0 8px">已按调整记录更新（含短缺/退款/现场加购）</div>
          <div class="flavorGrid">
            <div class="h">口味</div><div class="h flavorQty">数量</div><div class="h flavorAmt">金额</div>
            ${Object.entries(DATA.products).filter(([k]) => flavorTotals[k] > 0).map(([k, info]) => {
              if (info.unverified) {
                return `
                  <div>${emojiLabel(info)} <span class="unverifiedTag">缺失/待确认</span></div>
                  <div class="flavorQty" style="color:var(--warn-text)">${formatQty(flavorTotals[k])}${unitOf(k)}</div>
                  <div class="flavorAmt" style="color:var(--warn-text)">待确认</div>
                `;
              }
              return `
                <div>${emojiLabel(info)} <span style="color:var(--muted)">· $${info.price.toFixed(2)}/${info.unit || "盒"}</span></div>
                <div class="flavorQty">${formatQty(flavorTotals[k])}${unitOf(k)}</div>
                <div class="flavorAmt">$${(flavorTotals[k] * info.price).toFixed(2)}</div>
              `;
            }).join("")}
          </div>
          <div class="grandTotalBlock">
            <div class="grandTotalRow"><span>合计</span><span class="grandTotalAmt">$${grandTotal.toFixed(2)}</span></div>
            <div class="grandTotalQty">${formatUnitTotals(grandUnitTotals)}</div>
          </div>
        </div>

        ${storageDebug ? `<div class="debugBanner">🔧 ${storageDebug}</div>` : ""}

        <div class="toolbar">
          <div class="toolBtn" id="exportReportBtn">🖨️ 导出报告（PDF/打印）</div>
          <div class="toolBtn" id="editToggleBtn">${editMode ? "✅ 完成编辑" : "✏️ 编辑调整"}</div>
          ${editMode ? `<div class="toolBtn" id="addWalkinBtn">${openAdjustFormFor === "__walkin__" ? "取消新增" : "+ 新增买家"}</div>` : ""}
          ${editMode ? `<div class="toolBtn" id="bulkToggleBtn">${showBulkPanel ? "收起批量导入" : "📋 批量导入调整"}</div>` : ""}
        </div>

        ${showPinInput && !editUnlocked ? `
          <div class="pinRow">
            <input type="password" id="pinInput" placeholder="输入编辑密码" value="${escapeHtml(pinDraft)}">
            <div class="toolBtn" id="pinSubmitBtn">解锁</div>
          </div>
          ${pinError ? `<div class="adjError" style="text-align:center">${pinError}</div>` : ""}
        ` : ""}

        ${editMode && showBulkPanel ? `
          <div class="card bulkPanel">
            <div class="sectionTitle" style="margin-top:0">批量导入调整（JSON）</div>
            <div class="footNote" style="text-align:left;margin-bottom:8px;font-size:11px">
              粘贴一个调整条目数组，例如（把这段发给 Claude，让它根据送货情况帮你生成）：<br>
              [{"member":"Peter","type":"item","itemKey":"sig","qtyDelta":-1,"amountDelta":-6.5,"note":"到货少一份"},<br>
              {"member":"Amy","type":"credit","amountDelta":-3,"note":"退款：等太久"}]
            </div>
            <textarea id="bulkJson" placeholder="粘贴 JSON 数组">${escapeHtml(bulkDraft)}</textarea>
            ${bulkError ? `<div class="adjError">${bulkError}</div>` : ""}
            <div class="adjFormBtns">
              <div class="toolBtn" id="bulkApplyBtn">应用调整</div>
            </div>
          </div>
        ` : ""}

        <p class="footNote">付款状态与调整记录均实时同步给所有打开此链接的人。新增团购请在 manifest.json 中添加条目。</p>

        ${openUnit && grandUnitBreakdown[openUnit] ? renderUnitOverlay(openUnit, grandUnitBreakdown[openUnit]) : ""}

        ${renderPrintSection(members, flavorTotals, grandTotal, collected, grandUnitTotals)}
      `;

      document.querySelectorAll(".buyTab").forEach(el => {
        el.addEventListener("click", () => loadGroupBuy(parseInt(el.dataset.index, 10)));
      });
      document.querySelectorAll(".tab").forEach(el => {
        el.addEventListener("click", () => { filter = el.dataset.filter; render(); });
      });
      document.querySelectorAll(".payBtn").forEach(el => {
        el.addEventListener("click", () => {
          togglePaid(GROUP_BUYS[activeIndex].date, el.dataset.name);
        });
      });
      document.querySelectorAll(".unitRow").forEach(el => {
        el.addEventListener("click", () => { openUnit = el.dataset.unit; render(); });
      });
      const overlayEl = document.getElementById("unitOverlay");
      if (overlayEl) {
        overlayEl.addEventListener("click", () => { openUnit = null; render(); });
      }
      document.getElementById("exportReportBtn").addEventListener("click", exportReport);

      document.querySelectorAll(".copyMsgBtn").forEach(el => {
        el.addEventListener("click", () => {
          const name = el.dataset.name;
          const member = members.find(mm => mm.name === name);
          if (!member) return;
          copyTextToClipboard(buildMemberMessage(member)).then(() => {
            copiedFor = name;
            render();
            setTimeout(() => {
              if (copiedFor === name) { copiedFor = null; render(); }
            }, 1500);
          });
        });
      });
      document.querySelectorAll(".adjAddBtn").forEach(el => {
        el.addEventListener("click", () => {
          const target = el.dataset.member;
          if (openAdjustFormFor === target) { openAdjustFormFor = null; }
          else { openAdjustFormFor = target; resetAdjDraft(); }
          render();
        });
      });
      document.querySelectorAll(".adjUndo").forEach(el => {
        el.addEventListener("click", (evt) => {
          evt.stopPropagation();
          deleteAdjustment(GROUP_BUYS[activeIndex].date, el.dataset.id);
        });
      });
      document.querySelectorAll('input[name="adjType"]').forEach(el => {
        el.addEventListener("change", () => { adjFormType = el.value; render(); });
      });
      const adjWalkinNameEl = document.getElementById("adjWalkinName");
      if (adjWalkinNameEl) adjWalkinNameEl.addEventListener("input", () => { adjDraft.name = adjWalkinNameEl.value; });
      const adjItemKeyEl = document.getElementById("adjItemKey");
      if (adjItemKeyEl) adjItemKeyEl.addEventListener("change", () => { adjDraft.itemKey = adjItemKeyEl.value; });
      const adjQtyDeltaEl = document.getElementById("adjQtyDelta");
      if (adjQtyDeltaEl) adjQtyDeltaEl.addEventListener("input", () => { adjDraft.qtyDelta = adjQtyDeltaEl.value; });
      const adjAmountEl = document.getElementById("adjAmount");
      if (adjAmountEl) adjAmountEl.addEventListener("input", () => { adjDraft.amount = adjAmountEl.value; });
      const adjNoteEl = document.getElementById("adjNote");
      if (adjNoteEl) adjNoteEl.addEventListener("input", () => { adjDraft.note = adjNoteEl.value; });

      if (adjSaveBtn) adjSaveBtn.addEventListener("click", () => handleAdjSave(adjSaveBtn.dataset.member));

      if (adjCancelBtn) adjCancelBtn.addEventListener("click", () => { openAdjustFormFor = null; resetAdjDraft(); render(); });

      const editToggleBtn = document.getElementById("editToggleBtn");
      if (editToggleBtn) editToggleBtn.addEventListener("click", () => {
        if (!editUnlocked) { showPinInput = !showPinInput; }
        else { editMode = !editMode; openAdjustFormFor = null; showBulkPanel = false; resetAdjDraft(); }
        render();
      });
      const pinSubmitBtn = document.getElementById("pinSubmitBtn");
      if (pinSubmitBtn) pinSubmitBtn.addEventListener("click", handlePinSubmit);
      const pinInputEl = document.getElementById("pinInput");
      if (pinInputEl) {
        pinInputEl.addEventListener("input", () => { pinDraft = pinInputEl.value; });
        pinInputEl.addEventListener("keydown", (e) => { if (e.key === "Enter") handlePinSubmit(); });
      }

      const addWalkinBtn = document.getElementById("addWalkinBtn");
      if (addWalkinBtn) addWalkinBtn.addEventListener("click", () => {
        if (openAdjustFormFor === "__walkin__") { openAdjustFormFor = null; }
        else { openAdjustFormFor = "__walkin__"; resetAdjDraft(); }
        render();
      });
      const bulkToggleBtn = document.getElementById("bulkToggleBtn");
      if (bulkToggleBtn) bulkToggleBtn.addEventListener("click", () => { showBulkPanel = !showBulkPanel; bulkError = ""; render(); });

      const bulkApplyBtn = document.getElementById("bulkApplyBtn");
      if (bulkApplyBtn) bulkApplyBtn.addEventListener("click", handleBulkApply);
    }

    // A compact "Label x3盒、Other x1盒" summary of one member's order plus any
    // adjustments, for the dense print table — not the multi-line on-screen list.
    function printItemsLine(m) {
      const parts = Object.entries(m.items).map(([k, qty]) => {
        const info = DATA.products[k];
        if (!info) return "";
        return info.unverified
          ? `${emojiLabel(info)}x${formatQty(qty)}${unitOf(k)}(待确认)`
          : `${emojiLabel(info)}x${formatQty(qty)}${unitOf(k)}`;
      }).filter(Boolean);
      const adjParts = adjustmentsForMember(m.name).map(a => {
        if (a.type === "item" && a.itemKey && DATA.products[a.itemKey]) {
          const info = DATA.products[a.itemKey];
          const qtySign = a.qtyDelta >= 0 ? "+" : "";
          return `${emojiLabel(info)}${qtySign}${formatQty(a.qtyDelta)}${unitOf(a.itemKey)}${a.note ? `[${a.note}]` : ""}`;
        }
        const sign = a.amountDelta >= 0 ? "+" : "";
        return `${sign}$${a.amountDelta.toFixed(2)}${a.note ? `[${a.note}]` : ""}`;
      });
      return [...parts, ...adjParts].join("、") || "—";
    }

    // The only thing actually shown when printing (see the @media print rule,
    // which hides every other direct child of .page) — a dense table instead
    // of the on-screen cards, which ran to many pages for a real-size round.
    function renderPrintSection(members, flavorTotals, grandTotal, collected, grandUnitTotalsArg) {
      const unverifiedCount = countUnverifiedLines(members);
      return `
        <div class="printOnly">
          <div class="shopHead"><h1 class="shopName">${DATA.groupName || "团购"}</h1></div>
          <div class="printMeta">
            ${GROUP_BUYS[activeIndex] ? (GROUP_BUYS[activeIndex].label || GROUP_BUYS[activeIndex].date) : ""}
            ・共${members.length}人・总额$${grandTotal.toFixed(2)}・已收$${collected.toFixed(2)}・未收$${(grandTotal - collected).toFixed(2)}
          </div>
          ${unverifiedCount > 0 ? `<div class="printWarn">⚠️ ${unverifiedCount} 项商品价格/品种待确认，未计入总额</div>` : ""}
          <table class="printTable">
            <thead><tr><th>姓名</th><th>明细</th><th>金额</th><th>状态</th></tr></thead>
            <tbody>
              ${members.map(m => `
                <tr>
                  <td>${m.name}${m.isWalkin ? "（现场加购）" : ""}</td>
                  <td>${printItemsLine(m)}</td>
                  <td class="printAmt">$${m.total.toFixed(2)}</td>
                  <td class="printStatus">${paidState[m.name] ? "已付" : "未付"}</td>
                </tr>
              `).join("")}
            </tbody>
            <tfoot>
              <tr><td colspan="2">合计</td><td class="printAmt">$${grandTotal.toFixed(2)}</td><td></td></tr>
            </tfoot>
          </table>
          <div class="printSectionTitle">备货清单</div>
          <table class="printTable">
            <thead><tr><th>口味</th><th>数量</th><th>金额</th></tr></thead>
            <tbody>
              ${Object.entries(DATA.products).filter(([k]) => flavorTotals[k] > 0).map(([k, info]) => {
                if (info.unverified) {
                  return `<tr><td>${emojiLabel(info)}(待确认)</td><td class="printAmt">${formatQty(flavorTotals[k])}${unitOf(k)}</td><td class="printAmt">待确认</td></tr>`;
                }
                return `<tr><td>${emojiLabel(info)}</td><td class="printAmt">${formatQty(flavorTotals[k])}${unitOf(k)}</td><td class="printAmt">$${(flavorTotals[k] * info.price).toFixed(2)}</td></tr>`;
              }).join("")}
            </tbody>
            <tfoot>
              <tr><td>合计</td><td class="printAmt">${formatUnitTotals(grandUnitTotalsArg)}</td><td class="printAmt">$${grandTotal.toFixed(2)}</td></tr>
            </tfoot>
          </table>
        </div>
      `;
    }

    function renderUnitOverlay(u, breakdown) {
      const entries = Object.entries(breakdown);
      const subtotal = entries.reduce((s, [key, qty]) => {
        const info = DATA.products[key];
        if (!info || info.unverified) return s;
        return s + info.price * qty;
      }, 0);
      return `
        <div class="unitOverlay" id="unitOverlay">
          <div class="unitOverlayCard">
            <div class="sectionTitle" style="margin-top:0">总数量（${u}）明细</div>
            ${entries.map(([key, qty]) => {
              const info = DATA.products[key];
              const unverified = !!info.unverified;
              const amt = unverified ? "待确认" : `$${(info.price * qty).toFixed(2)}`;
              return `<div class="itemLine${unverified ? " unverified" : ""}"><span>${emojiLabel(info)} x${formatQty(qty)}${u}${unverified ? '<span class="unverifiedTag">缺失/待确认</span>' : ""}</span><span class="itemAmt">${amt}</span></div>`;
            }).join("")}
            <div class="rowTotalLine"><span>小计</span><span class="rowTotalAmt">$${subtotal.toFixed(2)}</span></div>
            <div class="footNote" style="margin-top:14px">点击任意处关闭</div>
          </div>
        </div>
      `;
    }

    // Opens the browser's print dialog with a clean, formatted version of the
    // current round (every member regardless of the active filter, no edit
    // controls) — the person can print it or choose "Save as PDF" for a file.
    // print.css (below, @media print) hides everything interactive.
    function exportReport() {
      const prevFilter = filter;
      const prevEditMode = editMode;
      const prevOpenUnit = openUnit;
      const prevTitle = document.title;
      filter = "all";
      editMode = false;
      openUnit = null;
      openAdjustFormFor = null;
      showBulkPanel = false;
      showPinInput = false;
      render();
      if (DATA && GROUP_BUYS[activeIndex]) {
        document.title = `${DATA.groupName || "团购"}-${GROUP_BUYS[activeIndex].label || GROUP_BUYS[activeIndex].date}`;
      }
      let restored = false;
      const restore = () => {
        if (restored) return;
        restored = true;
        filter = prevFilter;
        editMode = prevEditMode;
        openUnit = prevOpenUnit;
        document.title = prevTitle;
        render();
        window.removeEventListener("afterprint", restore);
      };
      window.addEventListener("afterprint", restore);
      requestAnimationFrame(() => {
        window.print();
        // Safety net for browsers that don't fire afterprint reliably.
        setTimeout(restore, 2000);
      });
    }

    function showLoadErrorFallback(message) {
      document.getElementById("app").innerHTML =
        `<div class="shopHead"><h1 class="shopName">${message}</h1></div>
        <p class="footNote">请检查 manifest.json 和对应的 data-*.json 文件是否已上传到仓库根目录。</p>`;
    }

    // Loads the emoji lookup table in parallel with the group-buy data itself
    // (not blocking boot on it) — if it's still on the way when the first
    // render happens, items just show the plain default icon until it lands
    // and triggers a re-render.
    fetch(EMOJI_MAP_URL)
      .then(r => r.ok ? r.json() : null)
      .then(map => { if (map) { EMOJI_MAP = map; if (DATA) render(); } })
      .catch(() => {});

    // Boot: fetch the manifest listing all group buys, sort newest first, load the most recent.
    fetch(MANIFEST_URL)
      .then(r => { if (!r.ok) throw new Error("no manifest"); return r.json(); })
      .then(manifest => {
        GROUP_BUYS = (manifest.groupBuys || []).slice().sort((a, b) => b.date.localeCompare(a.date));
        if (!GROUP_BUYS.length) throw new Error("empty manifest");
        activeIndex = 0;
        return fetch(GROUP_BUYS[0].file).then(r => r.json());
      })
      .then(json => {
        DATA = json;
        subscribeToPaidState(GROUP_BUYS[0].date);
        subscribeToAdjustments(GROUP_BUYS[0].date);
      })
      .catch(() => showLoadErrorFallback("未找到 manifest.json 或数据文件"));
  </script>
</body>
</html>

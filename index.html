    // one message for the whole group, not per-member, and isn't tied to
    // paid status — everyone gets mentioned regardless of who's paid.
    //
    // "What arrived" (`{arrived}`) comes from data-<date>.json's optional
    // `itemsLabel` field (a short phrase for the round, e.g. "小馄饨") when
    // set; otherwise it falls back to "{date label}团购" (e.g. "9/1团购"),
    // never to a list of every product — a round with a handful of dozens
    // of distinct products (a typical big produce run) would otherwise turn
    // this into an unreadable wall of text if itemsLabel was forgotten when
    // the round's data file was created. The pickup location and the rest
    // of the wording come from message-template.json, same as
    // buildMemberMessage.
    function buildGroupAnnouncement() {
      const t = MESSAGE_TEMPLATE;
      const mentions = allMemberNamesInOrder()
        .map(name => `${t.mentionPrefix}${name}`)
        .join(t.mentionSeparator);
      const gb = GROUP_BUYS[activeIndex];
      const fallbackArrived = `${(gb && (gb.label || gb.date)) || "本场"}团购`;
      const arrived = DATA.itemsLabel || fallbackArrived;
      const body = fillTemplate(t.groupAnnouncementText, { arrived, location: t.pickupLocation });
      return `${mentions}\n\n${body}`;
    }

    // navigator.clipboard needs a secure context + user gesture, both true
    // here (GitHub Pages is https, this runs from a tap), but falls back to
    // the old textarea+execCommand trick for any browser that lacks it.
    function copyTextToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text).catch(() => legacyCopyToClipboard(text));
      }
      return Promise.resolve(legacyCopyToClipboard(text));
    }
    function legacyCopyToClipboard(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try { document.execCommand("copy"); } catch (e) {}
      document.body.removeChild(ta);
    }

    // Sums quantities per unit type (e.g. {"盒": 45, "kg": 3.5}) instead of
    // blindly adding boxes and kilos together into one meaningless number.
    function unitTotals(itemsList) {
      const totals = {};
      itemsList.forEach(items => {
        Object.entries(items).forEach(([key, qty]) => {
          const u = unitOf(key);
          totals[u] = (totals[u] || 0) + qty;
        });
      });
      return totals;
    }
    function formatQty(qty) {
      // trims trailing zeros: 1.50 -> 1.5, 3.00 -> 3
      // Number(qty) first: this is called all over (member cards, print,
      // stocking totals, messages) with quantities that often come straight
      // from a member's `items` in hand-authored data-<date>.json, which has
      // no type checking at all — a value accidentally quoted as a string
      // (e.g. "0.5" instead of 0.5, an easy slip when copy-pasting or typing
      // JSON by hand) would otherwise hit `qty.toFixed`, which doesn't exist
      // on strings, and throw — crashing the whole page for every visitor,
      // not just showing a wrong number for that one line.
      return Number(Number(qty).toFixed(2)).toString();
    }
    function formatUnitTotals(totals) {
      return Object.entries(totals)
        .map(([u, qty]) => `${formatQty(qty)}${u}`)
        .join(" + ");
    }

    function loadGroupBuy(index) {
      const previousIndex = activeIndex; // restored on failure — see .catch below
      activeIndex = index;
      const gb = GROUP_BUYS[index];
      fetch(noCacheUrl(gb.file), NO_STORE)
        .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
        .then(json => {
          DATA = json;
          filter = "all";
          selectedProduct = null;
          selectedProductOverlay = null;
          productSearchQuery = "";
          openAdjustFormFor = null;
          resetInlineEdits();
          showBulkPanel = false;
          bulkError = "";
          bulkDraft = "";
          copiedFor = null;
          announceCopied = false;
          roundLocked = false;
          showUnlockPrompt = false;
          unlockPinDraft = "";
          unlockPinError = "";
          showUnitsPanel = false;
          unitsDraft = {};
          unitsSaveMsg = "";
          resetAdjDraft();
          subscribeToPaidState(gb.date);
          subscribeToPackedState(gb.date);
          subscribeToAdjustments(gb.date);
        })
        .catch(e => {
          // A bad fetch (404) or a JSON syntax error in a hand-authored
          // data-<date>.json (a stray/missing comma, quote or bracket) used
          // to fail completely silently here — the tab click just did
          // nothing, with no clue why. Roll back to whichever round was
          // already showing (don't leave `DATA` pointing at nothing, and
          // don't strand the person on a blank page with no tabs to click
          // back with — see showLoadErrorFallback, which replaces the whole
          // page including the tab bar, and is only safe to use for the
          // very first load where there's no working round to fall back to)
          // and surface the real error in the same on-page banner Firestore
          // errors already use, instead of a silent no-op.
          activeIndex = previousIndex;
          storageDebug = `加载「${gb.label || gb.date}」的数据文件出错：${e.message}——请检查 ${gb.file} 的 JSON 格式是否正确（常见问题：多了/少了逗号、引号或括号）`;
          render();
        });
    }

    function adjustmentLineHtml(a) {
      // "weight" entries are informational only (no dollar amount) — see
      // the "实际到手重量" adjustment type.
      if (a.type === "weight") {
        const info = a.itemKey && DATA.products[a.itemKey];
        const label = `↳ ${info ? emojiLabel(info) : ""} 实际到手 ${formatQty(a.actualGrams)}g${a.note ? ` · ${escapeHtml(a.note)}` : ""}`;
        return `
          <div class="itemLine adjustment">
            <span>${label}</span>
            <span class="itemAmt">${editMode ? `<span class="adjUndo" role="button" tabindex="0" data-id="${a.id}">撤销</span>` : ""}</span>
          </div>
        `;
      }
      const sign = a.amountDelta >= 0 ? "+" : "";
      let label;
      if (a.type === "item" && a.itemKey && DATA.products[a.itemKey]) {
        const info = DATA.products[a.itemKey];
        const qtySign = a.qtyDelta >= 0 ? "+" : "";
        label = `↳ ${emojiLabel(info)} ${qtySign}${formatQty(a.qtyDelta)}${unitOf(a.itemKey)}${a.note ? ` · ${escapeHtml(a.note)}` : ""}`;
      } else {
        label = `↳ ${escapeHtml(a.note || "退款/补款")}`;
      }
      return `
        <div class="itemLine adjustment">
          <span>${label}</span>
          <span class="itemAmt">${sign}$${a.amountDelta.toFixed(2)}${editMode ? ` <span class="adjUndo" role="button" tabindex="0" data-id="${a.id}">撤销</span>` : ""}</span>
        </div>
      `;
    }

    function renderAdjForm(memberKey) {
      const isWalkin = memberKey === "__walkin__";
      const safeKey = escapeHtml(memberKey);
      const productKeys = Object.keys(DATA.products);
      const selectedItemKey = adjDraft.itemKey || productKeys[0] || "";
      return `
        <div class="adjForm">
          ${isWalkin ? `<input type="text" id="adjWalkinName" placeholder="买家姓名（现场加购、原本不在名单里的人）" value="${escapeHtml(adjDraft.name)}">` : ""}
          <div class="adjFormRow">
            <label><input type="radio" name="adjType" value="item" ${adjFormType === "item" ? "checked" : ""}> 品项数量变化</label>
            <label><input type="radio" name="adjType" value="credit" ${adjFormType === "credit" ? "checked" : ""}> 退款/补款（固定金额）</label>
            <label><input type="radio" name="adjType" value="weight" ${adjFormType === "weight" ? "checked" : ""}> 实际到手重量（仅备注，不影响金额）</label>
          </div>
          ${adjFormType === "item" ? `
            <select id="adjItemKey">
              ${productKeys.map(k => {
                const info = DATA.products[k];
                return `<option value="${k}" ${k === selectedItemKey ? "selected" : ""}>${emojiLabel(info)}${info.price != null ? ` ($${info.price.toFixed(2)}/${info.unit || "盒"})` : ""}</option>`;
              }).join("")}
            </select>
            <input type="number" id="adjQtyDelta" placeholder="数量变化，例如 -1（少1份）或 2（多卖2份）" step="any" value="${escapeHtml(adjDraft.qtyDelta)}">
            ${!isWalkin && gramsPerUnit(selectedItemKey) ? `
              <input type="number" id="adjGramsHelper" data-member="${safeKey}" placeholder="或输入实际到手重量（克），自动换算并按100g向下取整，例如 1230" step="any" value="${escapeHtml(adjDraft.gramsHelper)}">
              <div class="adjGramsPreview" id="adjGramsPreview" ${adjGramsPreview ? "" : "hidden"}>${escapeHtml(adjGramsPreview)}</div>
            ` : ""}
          ` : adjFormType === "weight" ? `
            <select id="adjItemKey">
              ${productKeys.map(k => {
                const info = DATA.products[k];
                return `<option value="${k}" ${k === selectedItemKey ? "selected" : ""}>${emojiLabel(info)}</option>`;
              }).join("")}
            </select>
            <input type="number" id="adjGrams" placeholder="实际到手重量（克），例如 2044" step="any" value="${escapeHtml(adjDraft.grams)}">
          ` : `
            <input type="number" id="adjAmount" placeholder="金额变化，例如 -6.5（退款）或 3（补款）" step="any" value="${escapeHtml(adjDraft.amount)}">
          `}
          <input type="text" id="adjNote" placeholder="备注，例如：到货少一份 / 现场加购" value="${escapeHtml(adjDraft.note)}">
          ${adjFormError ? `<div class="adjError">${adjFormError}</div>` : ""}
          <div class="adjFormBtns">
            <div class="toolBtn" id="adjSaveBtn" role="button" tabindex="0" data-member="${safeKey}">保存</div>
            <div class="toolBtn" id="adjCancelBtn" role="button" tabindex="0">取消</div>
          </div>
        </div>
      `;
    }

    // Live-converts the "实际到手重量" grams helper into the qtyDelta field
    // for any weight-priced item (see gramsPerUnit — plain kg items and
    // bagged/bulk items alike), so an admin can type what the scale actually
    // showed instead of hand-computing kg or a 包 fraction. Walk-ins
    // (memberKey === "__walkin__") don't have a fixed base order yet, so the
    // helper only applies to existing members.
    //
    // Deliberately does NOT call render(): render() rebuilds the whole page
    // via app.innerHTML, which would tear down and recreate this very input
    // on every keystroke and throw focus/cursor position away. Instead this
    // writes straight to the two DOM nodes it needs to update (the qty field
    // and the preview line) while still keeping adjDraft/adjGramsPreview in
    // sync so a render triggered by something else (e.g. a live Firestore
    // update arriving mid-edit) still shows the right values.
    function handleAdjGramsHelperInput(memberKey, rawValue) {
      adjDraft.gramsHelper = rawValue;
      const itemKey = adjDraft.itemKey || Object.keys(DATA.products)[0];
      const perUnit = gramsPerUnit(itemKey);
      const grams = parseFloat(rawValue);
      const qtyEl = document.getElementById("adjQtyDelta");
      const previewEl = document.getElementById("adjGramsPreview");
      if (!perUnit || memberKey === "__walkin__" || isNaN(grams) || grams <= 0) {
        adjGramsPreview = "";
        if (previewEl) { previewEl.textContent = ""; previewEl.hidden = true; }
        return;
      }
      const rounded = roundGramsDown(grams);
      const correctQty = rounded / perUnit;
      const currentQty = currentQtyFor(memberKey, itemKey);
      const delta = Math.round((correctQty - currentQty) * 10000) / 10000;
      adjDraft.qtyDelta = String(delta);
      if (qtyEl) qtyEl.value = adjDraft.qtyDelta;
      const info = DATA.products[itemKey];
      const unit = unitOf(itemKey);
      const amount = info && info.price != null ? info.price * delta : null;
      const deltaSign = delta >= 0 ? "+" : "";
      const amtText = amount == null ? "" : ` ≈ ${amount >= 0 ? "+" : "-"}$${Math.abs(amount).toFixed(2)}`;
      adjGramsPreview = `实收${formatQty(grams)}g → 按100g向下取整为${formatQty(rounded)}g = ${formatQty(correctQty)}${unit}（原${formatQty(currentQty)}${unit}，差${deltaSign}${formatQty(delta)}${unit}${amtText}）`;
      if (previewEl) { previewEl.textContent = adjGramsPreview; previewEl.hidden = false; }
    }

    function handleAdjSave(memberKey) {
      const isWalkin = memberKey === "__walkin__";
      const type = adjFormType;
      const note = (adjDraft.note || "").trim();
      let memberName = memberKey;
      if (isWalkin) {
        memberName = (adjDraft.name || "").trim();
        if (!memberName) { adjFormError = "请填写买家姓名"; render(); return; }
      }
      let entry;
      if (type === "item") {
        const itemKey = adjDraft.itemKey || Object.keys(DATA.products)[0];
        const qtyDelta = parseFloat(adjDraft.qtyDelta);
        if (!itemKey || isNaN(qtyDelta) || qtyDelta === 0) { adjFormError = "请填写有效的数量变化（不能是 0）"; render(); return; }
        const info = DATA.products[itemKey];
        const amountDelta = info && info.price != null ? info.price * qtyDelta : 0;
        entry = { member: memberName, type: "item", itemKey, qtyDelta, amountDelta, note, ts: Date.now() };
      } else if (type === "weight") {
        const itemKey = adjDraft.itemKey || Object.keys(DATA.products)[0];
        const actualGrams = parseFloat(adjDraft.grams);
        if (!itemKey || isNaN(actualGrams) || actualGrams <= 0) { adjFormError = "请填写有效的实际重量（克）"; render(); return; }
        entry = { member: memberName, type: "weight", itemKey, actualGrams, note, ts: Date.now() };
      } else {
        const amountDelta = parseFloat(adjDraft.amount);
        if (isNaN(amountDelta) || amountDelta === 0) { adjFormError = "请填写有效的金额（不能是 0）"; render(); return; }
        entry = { member: memberName, type: "credit", amountDelta, note, ts: Date.now() };
      }
      saveAdjustment(GROUP_BUYS[activeIndex].date, entry);
      openAdjustFormFor = null;
      resetAdjDraft();
      render();
    }

    function handleBulkApply() {
      let parsed;
      try { parsed = JSON.parse(bulkDraft); } catch (e) { bulkError = "JSON 解析失败：" + e.message; render(); return; }
      if (!Array.isArray(parsed)) { bulkError = "需要是一个 JSON 数组"; render(); return; }
      const cleaned = parsed
        .filter(e => e && e.member && (
          typeof e.amountDelta === "number" ||
          (e.type === "weight" && typeof e.actualGrams === "number")
        ))
        .map(e => e.type === "weight"
          ? { member: e.member, type: "weight", itemKey: e.itemKey, actualGrams: e.actualGrams, note: e.note || "", ts: Date.now() }
          : {
              member: e.member,
              type: e.type === "credit" ? "credit" : "item",
              itemKey: e.itemKey,
              qtyDelta: e.qtyDelta,
              amountDelta: e.amountDelta,
              note: e.note || "",
              ts: Date.now()
            });
      if (!cleaned.length) { bulkError = "没有找到有效的条目（每条至少需要 member，以及 amountDelta，或 type:\"weight\" + actualGrams）"; render(); return; }
      bulkApplyAdjustments(GROUP_BUYS[activeIndex].date, cleaned);
      bulkError = "";
      bulkDraft = "";
      showBulkPanel = false;
      render();
    }

    // Editable list of every current-round member's block/unit number — the
    // only place this data can be *edited* (reading it happens on every
    // member's card instead, see `.unitDisplay` in render()). Deliberately
    // not fed into buildMemberMessage()/buildGroupAnnouncement(), so it can
    // never end up in a WeChat message; *editing* is still gated behind edit
    // mode (opened via "🏠 门牌管理"), even though viewing isn't.
    function renderUnitsPanel() {
      const names = allMemberNamesInOrder();
      const baseCount = DATA.orders.length; // names before this index had a 接龙 position; see allMemberNamesInOrder
      return `
        <div class="card bulkPanel">
          <div class="sectionTitle" style="margin-top:0">门牌管理（楼栋/门牌号）</div>
          <div class="footNote" style="text-align:left;margin-bottom:10px;font-size:11px">
            仅用于组织配送——不会出现在"复制付款消息"或"复制到货通知"里，也不会显示在
            平时的卡片视图上。门牌信息会一直保留给所有团购场次使用，不需要每场重填。
            序号和接龙楼层里的顺序一致，方便核对。
          </div>
          ${names.map((name, i) => `
            <div class="unitsPanelRow">
              <span class="unitsPanelName">${i < baseCount ? `<span class="serialNum">${i + 1}.</span>` : ""}${escapeHtml(name)}</span>
              <input type="text" class="unitInput" data-name="${escapeHtml(name)}" placeholder="例如 12栋 06-02" value="${escapeHtml(unitsDraft[name] || "")}">
            </div>
          `).join("")}
          ${unitsSaveMsg ? `<div class="footNote" style="text-align:left">${unitsSaveMsg}</div>` : ""}
          <div class="adjFormBtns">
            <div class="toolBtn" id="unitsSaveBtn" role="button" tabindex="0">保存</div>
          </div>
        </div>
      `;
    }

    function handlePinSubmit() {
      if (pinDraft === EDIT_PIN) {
        editUnlocked = true;
        editMode = true;
        showPinInput = false;
        pinError = "";
        pinDraft = "";
        try { localStorage.setItem("wg_edit_unlocked", "1"); } catch (e) {}
      } else {
        pinError = "密码错误";
      }
      render();
    }

    function render() {
      const app = document.getElementById("app");
      // Defense in depth: every current caller already only calls render()
      // once DATA is loaded (or, on a failed round switch, leaves the
      // previous round's DATA in place — see loadGroupBuy's .catch), so this
      // shouldn't ever be reachable. Guarding it anyway costs nothing and
      // means a future subscription/handler that forgets that rule fails
      // quietly instead of throwing on `DATA.orders` and crashing the page.
      if (!DATA) return;

      // `id` doubles as this member's position in the original 接龙 (data-<date>.json's
      // `orders` array is already in the order the message listed them) — shown as a
      // "1." serial number prefix on their card, the print report, and the 门牌管理
      // panel, so the dashboard's list can be cross-checked against the raw 接龙.
      // Walk-ins (added later via adjustments) never had a 接龙 position, so they get
      // a string id instead and are left unnumbered — see the `typeof m.id === "number"`
      // checks below.
      // `items` defaults to {} for a member entry that's missing it (a
      // hand-authored data-<date>.json row with no `items` key at all) — every
      // consumer of a member object (cost(), effectiveItems(), the item loop

      const walkinNames = Array.from(new Set(

      document.querySelectorAll(".buyTab").forEach(el => {

        if (Object.keys(patch).length === 0) { unitsSaveMsg = "没有改动"; render(); return; }
        saveMemberUnits(patch);
      });

      const cleanupInvalidBtn = document.getElementById("cleanupInvalidBtn");
      if (cleanupInvalidBtn) cleanupInvalidBtn.addEventListener("click", (evt) => {
        evt.stopPropagation();
        cleanupInvalidAdjustments(GROUP_BUYS[activeIndex].date);
      });
    }

    // A compact "Label x3盒、Other x1盒" summary of one member's order plus any
    // adjustments, for the dense print table — not the multi-line on-screen list.
    function printItemsLine(m) {
      const parts = Object.entries(m.items).map(([k, qty]) => {
        const info = DATA.products[k];
        if (!info) return "";
        return isUnverified(k)
          ? `${emojiLabel(info)}x${formatQty(qty)}${unitOf(k)}(待确认)`
          : `${emojiLabel(info)}x${formatQty(qty)}${unitOf(k)}`;
      }).filter(Boolean);
      const adjParts = adjustmentsForMember(m.name).map(a => {
        // "weight" entries are informational only — no amountDelta at all by
        // design (see the "实际到手重量" adjustment type) — so they must be
        // handled separately, same as adjustmentLineHtml()/buildMemberMessage()
        // already do, instead of falling into the amountDelta branch below.
        if (a.type === "weight") {
          const info = a.itemKey && DATA.products[a.itemKey];
          return `${info ? emojiLabel(info) : ""}实收${formatQty(a.actualGrams)}g`;
        }
        if (a.type === "item" && a.itemKey && DATA.products[a.itemKey]) {
          const info = DATA.products[a.itemKey];
          const qtySign = a.qtyDelta >= 0 ? "+" : "";
          return `${emojiLabel(info)}${qtySign}${formatQty(a.qtyDelta)}${unitOf(a.itemKey)}${a.note ? `[${a.note}]` : ""}`;
        }
        const sign = a.amountDelta >= 0 ? "+" : "";
        return `${sign}$${a.amountDelta.toFixed(2)}${a.note ? `[${a.note}]` : ""}`;
      });
      return [...parts, ...adjParts].join("、") || "—";
    }

    // The only thing actually shown when printing (see the @media print rule,
    // which hides every other direct child of .page) — a dense table instead
    // of the on-screen cards, which ran to many pages for a real-size round.
    function renderPrintSection(members, flavorTotals, grandTotal, collected, grandUnitTotalsArg) {
      const unverifiedCount = countUnverifiedLines(members);
      return `
        <div class="printOnly">
          <div class="shopHead"><h1 class="shopName">${DATA.groupName || "团购"}</h1></div>
          <div class="printMeta">
            ${GROUP_BUYS[activeIndex] ? (GROUP_BUYS[activeIndex].label || GROUP_BUYS[activeIndex].date) : ""}
            ・共${members.length}人・总额$${grandTotal.toFixed(2)}・已收$${collected.toFixed(2)}・未收$${(grandTotal - collected).toFixed(2)}
          </div>
          ${unverifiedCount > 0 ? `<div class="printWarn">⚠️ ${unverifiedCount} 项商品价格/品种待确认，未计入总额</div>` : ""}
          <table class="printTable">
            <thead><tr><th>#</th><th>姓名</th><th>明细</th><th>金额</th><th>状态</th></tr></thead>
            <tbody>
              ${members.map(m => `
                <tr>
                  <td>${typeof m.id === "number" ? m.id + 1 : ""}</td>
                  <td>${escapeHtml(m.name)}${m.isWalkin ? "（现场加购）" : ""}</td>
                  <td>${printItemsLine(m)}</td>
                  <td class="printAmt">$${m.total.toFixed(2)}</td>
                  <td class="printStatus">${paidState[m.name] ? "已付" : "未付"}</td>
                </tr>
              `).join("")}
            </tbody>
            <tfoot>
              <tr><td colspan="3">合计</td><td class="printAmt">$${grandTotal.toFixed(2)}</td><td></td></tr>
            </tfoot>
          </table>
          <div class="printSectionTitle">备货清单</div>
          <table class="printTable">
            <thead><tr><th>口味</th><th>数量</th><th>金额</th></tr></thead>
            <tbody>
              ${Object.entries(DATA.products).filter(([k]) => flavorTotals[k] > 0).map(([k, info]) => {
                // isUnverified() here too — see the matching comment on the
                // on-screen 备货清单 above; a price-less product without an
                // explicit unverified flag would otherwise crash the print
                // report's rendering (and the print section is built into
                // every normal render(), not just when actually printing).
                if (isUnverified(k)) {
                  return `<tr><td>${emojiLabel(info)}(待确认)</td><td class="printAmt">${formatQty(flavorTotals[k])}${unitOf(k)}</td><td class="printAmt">待确认</td></tr>`;
                }
                return `<tr><td>${emojiLabel(info)}</td><td class="printAmt">${formatQty(flavorTotals[k])}${unitOf(k)}</td><td class="printAmt">$${(flavorTotals[k] * info.price).toFixed(2)}</td></tr>`;
              }).join("")}
            </tbody>
            <tfoot>
              <tr><td>合计</td><td class="printAmt">${formatUnitTotals(grandUnitTotalsArg)}</td><td class="printAmt">$${grandTotal.toFixed(2)}</td></tr>
            </tfoot>
          </table>
        </div>
      `;
    }

    // Shown below the 商品查询 search input while the user is typing — a
    // faster alternative to scrolling the <select> for a long product list.
    // Matches by plain substring against the Chinese label (this dashboard's
    // whole UI is Mandarin, so 1-2 typed characters is the expected input,
    // no pinyin index needed). Returns "" when the query is empty, which
    // collapses the results container via the `:empty` CSS rule.
    function renderProductSearchResults(keys, query) {
      const q = query.trim();
      if (!q) return "";
      const matches = keys.filter(k => {
        const info = DATA.products[k];
        return info && info.label && info.label.includes(q);
      });
      if (!matches.length) return `<div class="productSearchEmpty">没有找到匹配的商品</div>`;
      return matches.map(k => {
        const info = DATA.products[k];
        const meta = isUnverified(k) ? "待确认" : `$${info.price.toFixed(2)}/${info.unit || "盒"}`;
        return `<div class="productSearchResult" role="button" tabindex="0" data-key="${k}">${emojiLabel(info)} · ${meta}</div>`;
      }).join("");
    }

    // Live-filters the 商品查询 search results as the user types, writing
    // straight to the results DOM node instead of calling render() — same
    // reasoning as handleAdjGramsHelperInput above: render() rebuilds the
    // whole page via app.innerHTML, which would tear down and recreate this
    // very <input> on every keystroke and throw focus/cursor position away.
    function handleProductSearchInput(value) {
      productSearchQuery = value;
      const resultsEl = document.getElementById("productSearchResults");
      if (resultsEl) resultsEl.innerHTML = renderProductSearchResults(productSearchRoundKeys, value);
    }

    // Tapping a search result behaves exactly like picking that product from
    // the <select> — jumps straight to its who-ordered-what view — then
    // clears the search box so it doesn't sit there stale.
    function selectProductFromSearch(key) {
      selectedProduct = key;
      productSearchQuery = "";
      render();
    }

    // Shown in the 商品查询 detail area when no single product is selected:
    // the full stocking list for the round (same content the old standalone
    // 备货清单 card always showed).
    function renderAllProductsList(flavorTotals, grandUnitTotals, grandTotal) {
      return `
        <div class="flavorGrid">
          <div class="h">口味</div><div class="h flavorQty">数量</div><div class="h flavorAmt">金额</div>
          ${Object.entries(DATA.products).filter(([k]) => flavorTotals[k] > 0).map(([k, info]) => {
            // isUnverified() (not a bare `info.unverified` check) so a
            // product missing its `price` is caught here too, even if
            // whoever wrote data-<date>.json forgot to also set
            // `unverified: true` — otherwise `info.price.toFixed(2)` below
            // throws on a null/undefined price and crashes the whole page.
            // Every cell carries data-key so the whole visual row is
            // clickable (see the .flavorGrid [data-key] wiring in render());
            // only the first cell is a real keyboard stop (role="button"
            // tabindex="0") so tabbing through the list costs one stop per
            // product, not three.
            if (isUnverified(k)) {
              return `
                <div role="button" tabindex="0" data-key="${k}">${emojiLabel(info)} <span class="unverifiedTag">缺失/待确认</span></div>
                <div class="flavorQty" style="color:var(--warn-text)" data-key="${k}">${formatQty(flavorTotals[k])}${unitOf(k)}</div>
                <div class="flavorAmt" style="color:var(--warn-text)" data-key="${k}">待确认</div>
              `;
            }
            return `
              <div role="button" tabindex="0" data-key="${k}">${emojiLabel(info)} <span style="color:var(--muted)">· $${info.price.toFixed(2)}/${info.unit || "盒"}</span></div>
              <div class="flavorQty" data-key="${k}">${formatQty(flavorTotals[k])}${unitOf(k)}</div>
              <div class="flavorAmt" data-key="${k}">$${(flavorTotals[k] * info.price).toFixed(2)}</div>
            `;
          }).join("")}
        </div>
        <div class="grandTotalBlock">
          <div class="grandTotalRow"><span>合计</span><span class="grandTotalAmt">$${grandTotal.toFixed(2)}</span></div>
          <div class="grandTotalQty">${formatUnitTotals(grandUnitTotals)}</div>
        </div>
      `;
    }

    // Shown in the 商品查询 detail area once a single product is selected:
    // who ordered it and how much, using effectiveItems() so it reflects
    // adjustments (shortages/refunds/walk-ins) the same way 备货清单 does.
    function renderProductMembers(key, members) {
      const info = DATA.products[key];
      if (!info) return "";
      const unit = unitOf(key);
      const unverified = isUnverified(key);
      const buyers = members
        .map(m => ({ m, qty: effectiveItems(m)[key] }))
        .filter(x => x.qty);
      const totalQty = buyers.reduce((s, x) => s + x.qty, 0);
      const subtotal = unverified ? null : totalQty * info.price;
      return `
        <div class="productDetailHeader">
          <span>${emojiLabel(info)}${unverified ? '<span class="unverifiedTag">缺失/待确认</span>' : ""}</span>
          <span>${formatQty(totalQty)}${unit}</span>
        </div>
        ${buyers.length === 0 ? `<div class="emptyNote">暂无人认购</div>` : buyers.map(({ m, qty }) => `
          <div class="itemLine"><span>${escapeHtml(m.name)}${m.isWalkin ? '<span class="walkinTag">现场加购</span>' : ""}</span><span class="itemAmt">x${formatQty(qty)}${unit}</span></div>
        `).join("")}
        <div class="rowTotalLine"><span>小计</span><span class="rowTotalAmt">${unverified ? "待确认" : `$${subtotal.toFixed(2)}`}</span></div>
      `;
    }

    // Popup wrapper around renderProductMembers() for a 备货清单 row tap —
    // same content the 商品查询 dropdown's detail panel shows, just in a
    // modal instead of inline, so you don't have to touch the dropdown to
    // check one product you're already looking at in the table. Styled
    // like (and replacing) the old per-unit overlay this project used to
    // have. No stopPropagation anywhere inside — clicking the backdrop OR
    // the card itself closes it, matching the "点击任意处关闭" label.
    function renderProductOverlay(key, members) {
      return `
        <div class="productOverlay" id="productOverlay">
          <div class="productOverlayCard">
            ${renderProductMembers(key, members)}
            <div class="footNote" style="margin-top:14px">点击任意处关闭</div>
          </div>
        </div>
      `;
    }

    // Opens the browser's print dialog with a clean, formatted version of the
    // current round (every member regardless of the active filter, no edit
    // controls) — the person can print it or choose "Save as PDF" for a file.
    // print.css (below, @media print) hides everything interactive.
    function exportReport() {
      const prevFilter = filter;
      const prevEditMode = editMode;
      const prevSelectedProductOverlay = selectedProductOverlay;
      const prevTitle = document.title;
      filter = "all";
      editMode = false;
      selectedProductOverlay = null;
      openAdjustFormFor = null;
      showBulkPanel = false;
      showPinInput = false;
      render();
      if (DATA && GROUP_BUYS[activeIndex]) {
        document.title = `${DATA.groupName || "团购"}-${GROUP_BUYS[activeIndex].label || GROUP_BUYS[activeIndex].date}`;
      }
      let restored = false;
      const restore = () => {
        if (restored) return;
        restored = true;
        filter = prevFilter;
        editMode = prevEditMode;
        selectedProductOverlay = prevSelectedProductOverlay;
        document.title = prevTitle;
        render();
        window.removeEventListener("afterprint", restore);
      };
      window.addEventListener("afterprint", restore);
      // window.print() is called synchronously here, in the same tick as the
      // click handler — NOT deferred via requestAnimationFrame (as this used
      // to do). Deferring it even by one frame pushes it just far enough
      // outside the click's "user gesture" window that some browsers (Safari,
      // and especially WeChat's in-app browser — exactly what this group
      // uses) silently ignore the print() call rather than opening the
      // dialog, which is what made this take several clicks to work: each
      // click's deferred call either did or didn't land inside that
      // browser's grace window. Nothing about the print OUTPUT needed that
      // delay — renderPrintSection() already builds from the full,
      // unfiltered member list on every render() regardless of `filter`, and
      // @media print hides everything else via pure CSS — so there was
      // nothing to wait a frame for in the first place.
      window.print();
      // Safety net for browsers that don't fire afterprint reliably.
      setTimeout(restore, 2000);
    }

    function showLoadErrorFallback(message) {
      document.getElementById("app").innerHTML =
        `<div class="shopHead"><h1 class="shopName">${message}</h1></div>
        <p class="footNote">请检查 manifest.json 和对应的 data-*.json 文件是否已上传到仓库根目录。</p>`;
    }

    // Loads the emoji lookup table in parallel with the group-buy data itself
    // (not blocking boot on it) — if it's still on the way when the first
    // render happens, items just show the plain default icon until it lands
    // and triggers a re-render.
    fetch(noCacheUrl(EMOJI_MAP_URL), NO_STORE)
      .then(r => r.ok ? r.json() : null)
      .then(map => { if (map) { EMOJI_MAP = map; if (DATA) render(); } })
      .catch(() => {});

    // Loads the copy-message wording. Not render-affecting (the message is
    // only built when the button is tapped), so no re-render needed here —
    // just swap in whatever loaded, or silently keep the built-in default.
    fetch(noCacheUrl(MESSAGE_TEMPLATE_URL), NO_STORE)
      .then(r => r.ok ? r.json() : null)
      .then(tpl => { if (tpl) MESSAGE_TEMPLATE = Object.assign({}, MESSAGE_TEMPLATE, tpl); })
      .catch(() => {});

    // Member block/unit directory — persistent across every round, so it's
    // loaded once here rather than per round (see subscribeToMemberUnits).
    subscribeToMemberUnits();

    // Keyboard activation for every interactive element that's a <div> rather
    // than a real <button>/<a> (payBtn, tabs, copyMsgBtn, adjAddBtn,
    // toolBtn, adjUndo, announceBtn, the first cell of each 备货清单 row —
    // see role="button"/role="tab" in the render() template above; the
    // 商品查询 picker itself is a native <select> and needs none of this).
    // These already have mouse click handlers wired up per-render; without
    // this they'd be completely unreachable by keyboard (WCAG 2.1.1).
    // Delegated on the persistent #app node (never replaced itself, only
    // its innerHTML) so it keeps working across every re-render without
    // needing to be re-attached — same reasoning as the per-render
    // querySelectorAll wiring above, just for the keyboard path.
    document.getElementById("app").addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      const el = e.target.closest('[role="button"], [role="tab"]');
      if (!el) return;
      if (el.getAttribute("aria-disabled") === "true") return;
      e.preventDefault();
      el.click();
    });

    // Escape closes the 备货清单-row popup, matching the modal/sheet
    // convention of always offering a keyboard close path alongside
    // click-anywhere-to-close (which the popup already has).
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && selectedProductOverlay) { selectedProductOverlay = null; render(); }
    });

    // Boot: fetch the manifest listing all group buys, sort newest first, load the most recent.
    fetch(noCacheUrl(MANIFEST_URL), NO_STORE)
      .then(r => { if (!r.ok) throw new Error("manifest.json: HTTP " + r.status); return r.json(); })
      .then(manifest => {
        GROUP_BUYS = (manifest.groupBuys || []).slice().sort((a, b) => b.date.localeCompare(a.date));
        if (!GROUP_BUYS.length) throw new Error("manifest.json 里没有任何 groupBuys 条目");
        activeIndex = 0;
        return fetch(noCacheUrl(GROUP_BUYS[0].file), NO_STORE)
          .then(r => { if (!r.ok) throw new Error(`${GROUP_BUYS[0].file}: HTTP ${r.status}`); return r.json(); });
      })
      .then(json => {
        DATA = json;
        subscribeToPaidState(GROUP_BUYS[0].date);
        subscribeToPackedState(GROUP_BUYS[0].date);
        subscribeToAdjustments(GROUP_BUYS[0].date);
        refreshRoundStatuses(); // background, non-blocking — re-renders itself once done
      })
      // Include the real error (e.g. a JSON syntax error's message and
      // position) rather than a generic string — this is the very first
      // load, so unlike loadGroupBuy() above there's no previously-working
      // round to fall back to and no tab bar to preserve; a clear message is
      // the best that can be done here.
      .catch(e => showLoadErrorFallback(`加载出错：${e.message}——请检查 manifest.json 和最新的 data-*.json 文件是否已上传、格式是否正确`));
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>团购收款看板</title>
<style>
  :root {
    --bg: #efe7d8;
    --paper: #fffcf6;
    --ink: #2b2420;
    /* #756a58, not the original #8a7f6e: the original measured ~3.84:1 against
       --paper (#fffcf6) — fails WCAG AA's 4.5:1 for the many 11-14px normal-size
       labels/item lines that use this color (.statLabel, .itemLine, etc., none
       large enough for the 3:1 large-text exception). This darkened value clears
       4.5:1 against --paper without touching the dark-theme value below, which
       was already fine (~6:1) — checked independently per-theme, since a value
       verified in one theme doesn't imply it holds in the other. */
    --muted: #756a58;
    --line: #ddd2bd;
    --red: #b5482a;
    --green: #5c7a5e;
    --green-btn: #4f7f5b;
    --pack-btn: #4f6f8f;
    --warn-bg: #fdf0d5;
    --warn-border: #e0a838;
    --warn-text: #8a5a00;
    --warn-tag-bg: #e0a838;
    --warn-tag-text: #3a2800;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1c1815;
      --paper: #262019;
      --ink: #f1e9dd;
      --muted: #a99d8c;
      --line: #3d352c;
      --red: #e08064;
      --green: #8fbb96;
      --green-btn: #4f7f5b;
      --pack-btn: #6a93bd;
      --warn-bg: #3a2f10;
      --warn-border: #caa23a;
      --warn-text: #f0c869;
      --warn-tag-bg: #caa23a;
      --warn-tag-text: #2a1f00;
    }
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    margin: 0;
    padding: 20px 14px 60px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--ink);
  }
  .page { max-width: 480px; margin: 0 auto; }

  @media (min-width: 860px) {
    .page { max-width: 760px; }
    .ticket { padding: 20px 24px 8px; }
    #rows { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #rows .row { margin-bottom: 0; }
    .flavorGrid { max-width: 460px; }
  }

  .shopHead { text-align: center; margin-bottom: 18px; }
  .debugBanner {
    background: #222; color: #f88; font-family: "SF Mono", Menlo, Consolas, monospace;
    font-size: 11px; padding: 8px 10px; border-radius: 6px; margin: 0 0 14px;
    word-break: break-all; line-height: 1.5;
  }
  .shopName {
    font-family: Georgia, "Iowan Old Style", "Songti SC", serif;
    font-size: 26px;
    letter-spacing: 0.5px;
    margin: 0;
  }

  .buyTabs { display: flex; gap: 6px; margin-bottom: 16px; flex-wrap: wrap; justify-content: center; }
  .buyTab {
    padding: 7px 16px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: var(--paper); color: var(--muted);
    border-radius: 20px; cursor: pointer; user-select: none;
  }
  .buyTab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  /* Status coloring only applies to unselected tabs — the active/selected
     tab keeps its current dark highlight regardless of round status, so
     there's never a conflict between "this is open" and "this is selected". */
  .buyTab.completed:not(.active) { border-color: var(--green-btn); color: var(--green-btn); }
  .buyTab.pending:not(.active) { border-color: var(--red); color: var(--red); }

  .ticket, .card {
    background: var(--paper);
    border-radius: 4px;
    border: 1px solid var(--line);
    padding: 16px 16px 4px;
    margin-bottom: 16px;
  }
  .card { padding: 16px 16px 18px; }
  .card .sectionTitle { margin-top: 0; }
  .statRow { display: flex; justify-content: space-between; padding: 10px 0; }
  .statRow + .statRow { border-top: 1px dashed var(--line); }
  .statLabel { font-size: 13px; color: var(--muted); }
  .statValue { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 15px; font-weight: 600; }
  .statValue.big { font-size: 19px; }
  .statValue.green { color: var(--green); }
  .statValue.red { color: var(--red); }

  .progressTrack { height: 6px; background: var(--line); border-radius: 3px; margin: 2px 0 6px; overflow: hidden; }
  .progressFill { height: 100%; background: var(--green); transition: width 0.3s ease; }
  .progressLabel { font-size: 12px; color: var(--muted); padding-bottom: 14px; }

  .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
  .tab {
    flex: 1; text-align: center; padding: 8px 0; font-size: 13px;
    border: 1px solid var(--line); background: var(--paper); color: var(--muted);
    border-radius: 6px; cursor: pointer; user-select: none;
  }
  .tab.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  .row {
    background: var(--paper); border: 1px solid var(--line); border-radius: 8px;
    padding: 18px 18px 16px; margin-bottom: 16px;
    box-shadow: 0 1px 0 rgba(0,0,0,0.02);
  }
  .rowHead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
  .rowName { font-size: 17px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .serialNum {
    color: var(--muted); font-weight: 400; font-family: "SF Mono", Menlo, Consolas, monospace;
    margin-right: 4px;
  }
  .itemLine {
    display: flex; justify-content: space-between; gap: 8px;
    font-size: 14px; color: var(--muted); padding: 4px 0;
  }
  .itemLine .itemAmt { font-family: "SF Mono", Menlo, Consolas, monospace; flex-shrink: 0; }
  .itemLine.adjustment { font-style: italic; }
  .itemLine.adjustment .itemAmt { display: flex; align-items: center; gap: 6px; font-style: normal; }
  .adjUndo {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 11px; color: var(--red); cursor: pointer; text-decoration: underline;
    font-style: normal;
  }
  .rowTotalLine {
    display: flex; justify-content: space-between;
    margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--line);
    font-size: 16px; font-weight: 700;
  }
  .rowTotalLine .rowTotalAmt { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .payBtn {
    font-size: 12.5px; padding: 6px 13px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    cursor: pointer; user-select: none; display: inline-block; flex-shrink: 0;
  }
  .payBtn.on { background: var(--green-btn); border-color: var(--green-btn); color: white; }
  .payBtn.locked { opacity: 0.55; cursor: default; }
  .rowBtns { display: flex; gap: 6px; flex-shrink: 0; }
  .packBtn {
    font-size: 12.5px; padding: 6px 13px; border-radius: 14px;
    border: 1px solid var(--line); background: var(--bg); color: var(--muted);
    cursor: pointer; user-select: none; display: inline-block; flex-shrink: 0;
  }
  .packBtn.on { background: var(--pack-btn); border-color: var(--pack-btn); color: white; }

  .itemLine.unverified {
    color: var(--warn-text);
    background: var(--warn-bg);
    border-radius: 4px;
    padding: 2px 6px;
    font-weight: 600;
  }
  .unverifiedTag, .walkinTag {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    border-radius: 4px;
    padding: 1px 5px;
    margin-left: 6px;
  }
  .unverifiedTag { background: var(--warn-tag-bg); color: var(--warn-tag-text); }
  .walkinTag { background: var(--line); color: var(--muted); }
  .warnBanner {
    background: var(--warn-bg);
    border: 1px solid var(--warn-border);
    color: var(--warn-text);
    border-radius: 6px;
    padding: 10px 12px;
    font-size: 12.5px;
    margin-bottom: 14px;
    line-height: 1.5;
  }

  .sectionTitle {
    font-family: Georgia, serif; font-size: 16px; margin: 22px 0 10px;
    padding-bottom: 6px; border-bottom: 1px solid var(--line);
  }
  .flavorGrid { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 10px; font-size: 13px; }
  .flavorGrid .h { color: var(--muted); font-size: 11px; padding-bottom: 4px; border-bottom: 1px solid var(--line); }
  .flavorQty, .flavorAmt { font-family: "SF Mono", Menlo, Consolas, monospace; text-align: right; }
  .flavorAmt { color: var(--muted); }
  .grandTotalBlock {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--ink);
  }
  .grandTotalRow {
    display: flex; justify-content: space-between; align-items: baseline;
    font-weight: 700; font-size: 14px;
  }
  .grandTotalAmt { font-family: "SF Mono", Menlo, Consolas, monospace; }
  .grandTotalQty {
    font-family: "SF Mono", Menlo, Consolas, monospace; color: var(--muted);
    text-align: center; margin-top: 6px; font-size: 12.5px; line-height: 1.7;
  }

  .productSelect {
    width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
    font-family: inherit; margin-bottom: 14px;
  }
  .productSelect:focus { outline: none; border-color: var(--muted); }
  .productSearchInput {
    width: 100%; box-sizing: border-box; font-size: 14px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink);
    font-family: inherit; margin-bottom: 6px;
  }
  .productSearchInput:focus { outline: none; border-color: var(--muted); }
  .productSearchResults { margin-bottom: 8px; }
  .productSearchResults:empty { display: none; }
  .productSearchResult {
    padding: 9px 12px; margin-bottom: 6px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--paper); color: var(--ink); font-size: 13.5px; cursor: pointer;
  }
  .productSearchResult:hover { border-color: var(--muted); }
  .productSearchEmpty { padding: 6px 12px 8px; font-size: 13px; color: var(--muted); }
  .emptyNote { padding: 14px 12px; font-size: 13px; color: var(--muted); text-align: center; }
  .productDetailHeader {
    display: flex; justify-content: space-between; font-size: 14px; font-weight: 700;
    padding-bottom: 8px; margin-bottom: 6px; border-bottom: 1px solid var(--line);
  }

  /* Every stocking-list row is tappable to pop up who-ordered-what for that
     product (see renderProductOverlay) — same idea as the old total-by-unit
     overlay this replaced, just scoped to one product instead of one unit. */
  .flavorGrid [data-key] { cursor: pointer; }
  .flavorGrid [data-key]:active { opacity: 0.65; }
  .productOverlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px; z-index: 50;
  }
  .productOverlayCard {
    background: var(--paper); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px 18px 16px; max-width: 380px; width: 100%; max-height: 80vh;
    overflow-y: auto; box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }

  .toolbar {
    display: flex; gap: 8px; justify-content: center; margin: 22px 0 4px; flex-wrap: wrap;
  }
  .toolBtn {
    font-size: 12px; padding: 7px 12px; border-radius: 6px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    cursor: pointer;
  }
  .footNote { text-align: center; font-size: 11px; color: var(--muted); margin-top: 8px; }

  .adjAddBtn {
    display: inline-block; font-size: 12px; color: var(--muted);
    border: 1px dashed var(--line); border-radius: 10px; padding: 3px 10px;
    margin-top: 8px; cursor: pointer; user-select: none;
  }
  .copyMsgBtn {
    display: inline-block; font-size: 12.5px; color: var(--ink);
    border: 1px solid var(--line); background: var(--bg); border-radius: 12px;
    padding: 5px 12px; margin-top: 8px; margin-right: 6px;
    cursor: pointer; user-select: none;
  }
  .copyMsgBtn.copied { background: var(--green-btn); border-color: var(--green-btn); color: white; }
  .announceBtn {
    display: block; text-align: center; font-size: 15px; font-weight: 700;
    color: var(--paper); background: var(--ink); border: 1px solid var(--ink);
    border-radius: 10px; padding: 13px 14px; margin-bottom: 16px;
    cursor: pointer; user-select: none;
  }
  .announceBtn.copied { background: var(--green-btn); border-color: var(--green-btn); }
  .adjForm {
    margin-top: 10px; padding: 10px; border: 1px dashed var(--line); border-radius: 6px;
    background: var(--bg); font-size: 13px;
  }
  .adjForm input:not([type="radio"]), .adjForm select, .bulkPanel textarea {
    width: 100%; margin-bottom: 8px; padding: 7px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 13px; box-sizing: border-box; font-family: inherit;
  }
  .adjFormRow input[type="radio"] {
    width: auto; margin: 0; padding: 0; flex-shrink: 0;
  }
  .bulkPanel textarea {
    font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 12px; min-height: 100px;
  }
  .adjFormRow { display: flex; gap: 14px; margin-bottom: 8px; flex-wrap: wrap; font-size: 12.5px; }
  .adjFormRow label {
    display: flex; align-items: center; gap: 4px; cursor: pointer;
    white-space: nowrap; flex: 0 0 auto;
  }
  .adjFormBtns { display: flex; gap: 8px; }
  .adjError { color: var(--red); font-size: 12px; margin: 2px 0 8px; }
  .adjGramsPreview { color: var(--muted); font-size: 12px; margin: -4px 0 8px; line-height: 1.5; }
  /* Inline per-item editors (stepper/grams/pieces/box-share) — a faster
     alternative to the "+ 调整" form above, styled distinctly (rounded
     pill buttons vs the form's boxier inputs) so it reads as its own,
     lighter-weight interaction rather than a variant of the form. */
  .inlineEditor { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepBtn {
    width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--line);
    background: var(--bg); color: var(--ink); font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center; cursor: pointer; user-select: none;
  }
  .stepBtn:active { background: var(--line); }
  .stepQty { min-width: 26px; text-align: center; font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 13.5px; }
  .voidBtn, .saveBtn, .cancelBtn {
    font-size: 11.5px; padding: 4px 8px; border-radius: 10px; cursor: pointer; user-select: none;
    flex-shrink: 0; white-space: nowrap; display: inline-block;
  }
  .voidBtn { border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .saveBtn { background: var(--green-btn); color: white; border: 1px solid var(--green-btn); }
  .cancelBtn { border: 1px solid var(--line); background: var(--bg); color: var(--muted); }
  .numInput {
    padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper);
    color: var(--ink); font-family: inherit; font-size: 13px; width: 130px; flex: 1; min-width: 130px;
  }
  .inlinePreview { font-size: 12px; color: var(--muted); margin: -2px 0 6px; line-height: 1.5; }
  .inlineError { font-size: 12px; color: var(--red); margin: -2px 0 6px; line-height: 1.5; }
  .pinRow { display: flex; gap: 8px; justify-content: center; margin: 4px 0 6px; }
  .pinRow input { width: 140px; }

  .unitsPanelRow { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; font-size: 13px; }
  .unitsPanelRow .unitsPanelName { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .unitInput {
    flex: 0 0 130px; padding: 6px 8px; border-radius: 4px;
    border: 1px solid var(--line); background: var(--paper); color: var(--ink);
    font-size: 13px; font-family: inherit;
  }
  .unitDisplay { font-size: 12.5px; color: var(--muted); margin: -4px 0 10px; }

  /* Print gets its own dense table layout (see renderPrintSection) instead of
     reusing the on-screen cards, which ran to many pages per round. */
  /* Every click-only <div> acting as a button/tab (role="button"/role="tab",
     see render()) needs its own visible focus ring — a <div> has none by
     default the way a real <button> would, and these are now keyboard-
     reachable (see the Enter/Space handler at the bottom of the script). */
  .payBtn:focus-visible, .packBtn:focus-visible, .copyMsgBtn:focus-visible, .flavorGrid [data-key]:focus-visible,
  .adjAddBtn:focus-visible, .announceBtn:focus-visible, .toolBtn:focus-visible,
  .tab:focus-visible, .buyTab:focus-visible, .adjUndo:focus-visible, .productSearchResult:focus-visible,
  .stepBtn:focus-visible, .voidBtn:focus-visible, .saveBtn:focus-visible, .cancelBtn:focus-visible {
    outline: 2px solid var(--ink); outline-offset: 2px;
  }

  .printOnly { display: none; }
  @media print {
    body { background: #fff; padding: 8px; color: #000; }
    .page > *:not(.printOnly) { display: none !important; }
    .printOnly { display: block !important; }
    .printOnly .shopName { font-size: 18px; margin-bottom: 2px; }
    .printMeta { text-align: center; font-size: 11px; color: #333; margin-bottom: 10px; }
    .printWarn { font-size: 10.5px; color: #7a5200; margin-bottom: 8px; text-align: center; }
    .printSectionTitle { font-weight: 700; font-size: 12.5px; margin: 10px 0 4px; }
    .printTable { width: 100%; border-collapse: collapse; font-size: 10.5px; }
    .printTable th, .printTable td { border-bottom: 1px solid #ccc; padding: 2.5px 5px; text-align: left; vertical-align: top; }
    .printTable th { font-weight: 700; border-bottom: 1.5px solid #000; }
    .printTable tfoot td { font-weight: 700; border-top: 1.5px solid #000; border-bottom: none; }
    .printAmt { text-align: right; font-family: "SF Mono", Menlo, Consolas, monospace; white-space: nowrap; }
    .printStatus { text-align: center; white-space: nowrap; }
  }
</style>
</head>
<body>
  <div class="page" id="app"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot, getDoc, setDoc, deleteField } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmfejtmHiICRpYbQsnSGfzDrq7qkWendo",
      authDomain: "wg-group-buy.firebaseapp.com",
      projectId: "wg-group-buy",
      storageBucket: "wg-group-buy.firebasestorage.app",
      messagingSenderId: "373350678794",
      appId: "1:373350678794:web:4308b6043bd5c74f64baf3"
    };
    const firebaseApp = initializeApp(firebaseConfig);
    const db = getFirestore(firebaseApp);

    // Soft gate only — Firestore rules stay open to anyone with the link (same
    // trust model as paid-status today). This just stops accidental taps.
    // Change this before sharing the link if you want a different passcode.
    const EDIT_PIN = "1117";

    const MANIFEST_URL = "./manifest.json";

    // --- Cache busting for every static JSON fetch ------------------------
    // GitHub Pages serves these files with a max-age cache header, so a
    // browser tab that has visited before re-serves the OLD copy straight
    // from disk and never hits the network at all. Symptom: a new round is
    // pushed to the repo, but the page keeps showing the previous data —
    // while a private tab or the Home Screen web app (separate, cold caches)
    // shows the new data correctly, which makes it look like a deploy problem
    // when it isn't. Fixed by appending a unique ?v= to every data URL AND
    // sending cache: "no-store"; belt and braces, because the query param
    // alone can still be served from a Service-Worker-style cache and
    // no-store alone is ignored by some intermediate CDN layers.
    // One timestamp per page load (not per fetch) so switching rounds back
    // and forth within a session stays cheap.
    const BOOT_TS = Date.now();
    function noCacheUrl(url) {
      return url + (url.indexOf("?") === -1 ? "?" : "&") + "v=" + BOOT_TS;
    }
    const NO_STORE = { cache: "no-store" };

    // Keyword -> emoji lookup for product labels (see product-emoji-map.json).
    // Loaded in parallel with the group-buy data; falls back to a plain
    // shopping-cart icon for anything unmatched or while it's still loading.
    const EMOJI_MAP_URL = "./product-emoji-map.json";
    let EMOJI_MAP = { defaultEmoji: "🛒", categories: [] };
    // Wording for the WeChat copy-payment-message button (see
    // message-template.json). This default is used until that file loads,
    // and stays in effect if it 404s — kept identical to the shipped JSON so
    // there's no visible difference either way.
    const MESSAGE_TEMPLATE_URL = "./message-template.json";
    let MESSAGE_TEMPLATE = {
      greeting: "@{name}",
      itemLine: "{item}{qtySuffix}  {amount}{weightSuffix}",
      weightSuffix: "（{grams}g）",
      unverifiedAmount: "待确认",
      unverifiedSuffix: "（缺失/待确认）",
      adjItemLine: "↳ {item} {qtySign}{qty}{unit}{noteSuffix} {amount}",
      adjNoteSuffix: "（{note}）",
      adjOtherLine: "↳ {note} {amount}",
      adjDefaultNote: "退款/补款",
      totalLine: "一共{total}～",
      closingPaid: "",
      closingUnpaid: "",
      // For the "📢 复制到货通知" group announcement button (see buildGroupAnnouncement).
      mentionPrefix: "@",
      mentionSeparator: " ",
      pickupLocation: "06-02",
      groupAnnouncementText: "{arrived}到啦，欢迎来{location}自取，需要送货小群联系～"
    };
    // Tracked in a "Version log" table in wg-groupbuy-project-knowledge.md
    // (section A9) — bumped alongside every non-trivial index.html edit, in
    // the same commit/response, so the Project's stored copy can always be
    // checked against what's actually deployed before editing blind.
    const APP_VERSION = "1.1.0";
    let GROUP_BUYS = [];
    let activeIndex = 0;
    // Per-round tab coloring: "future" (date >= today, left default/uncolored),
    // "pending" (date < today, at least one base member unpaid — red), or
    // "completed" (date < today, every base member paid — green). Populated
    // once at boot by refreshRoundStatuses() via one-time reads (not live
    // subscriptions — only the active round needs live updates), since
    // determining every OTHER round's status needs data this app doesn't
    // otherwise load for inactive tabs. Deliberately checks only DATA.orders
    // (the base 接龙 list) and not walk-ins added via adjustments after the
    // fact — an unpaid walk-in on an otherwise-settled past round could
    // still show green. Cheap to compute (one file + one doc read per past
    // round, once per page load), fine at this app's scale.
    let roundStatus = {};
    let DATA = null;
    let paidState = {};
    // Whether each member's order has been physically packed for pickup —
    // a separate concern from payment (someone can pack before they've paid,
    // or vice versa), tracked the same live-sync way. Doc ID = group buy
    // date, same as paidStatus. No lock/all-packed side effect like
    // togglePaid() has — packing progress never freezes the round.
    let packedState = {};
    let adjustments = {}; // { entryId: { member, type, itemKey?, qtyDelta?, amountDelta, note, ts } }
    let filter = "all";
    let selectedProduct = null; // product key currently selected in the 商品查询 dropdown, or null for the full list
    let selectedProductOverlay = null; // product key whose who-ordered-what popup is open, from tapping a 备货清单 row
    // Free-text filter typed into the 商品查询 search box — a faster
    // alternative to scrolling the <select> for a long product list. Kept
    // as module state (not just a DOM value) so a live Firestore update
    // arriving mid-type doesn't wipe what's typed on the next render() call.
    // productSearchRoundKeys mirrors render()'s local roundProductKeys so
    // the input handler (which deliberately skips render(), see below) can
    // filter without recomputing flavorTotals from scratch.
    let productSearchQuery = "";
    let productSearchRoundKeys = [];
    let copiedFor = null; // member name whose WeChat message was just copied, for transient "已复制" feedback
    let announceCopied = false; // transient "已复制" feedback for the group arrival-announcement button

    // True once every member in this round has been marked paid — set via the
    // special "__locked" field in the same paidStatus/{date} Firestore doc (not
    // a separate collection, so it needs no new Firestore rule). While locked,
    // the round is read-only for everyone with the link: no marking (un)paid,
    // no adjustments, no walk-ins. See togglePaid() for how it gets set, and
    // handleUnlockSubmit() for how it gets cleared. This is shared/global —
    // it lives in Firestore like paid status itself, so it's the same for
    // every device and survives a page reload; only entering the edit PIN
    // clears it, a reload alone does not.
    let roundLocked = false;
    let showUnlockPrompt = false;
    let unlockPinDraft = "";
    let unlockPinError = "";

    let editUnlocked = false;
    try { editUnlocked = localStorage.getItem("wg_edit_unlocked") === "1"; } catch (e) {}
    let editMode = false;
    let showPinInput = false;
    let pinError = "";
    let pinDraft = "";
    let openAdjustFormFor = null; // a member name, "__walkin__", or null
    let adjFormType = "item";
    let adjFormError = "";
    // Draft values for the currently-open adjustment form. Kept in JS state
    // (not just read from the DOM at submit time) so an in-progress edit
    // survives a re-render triggered by someone else's live update arriving
    // via Firestore mid-edit, or by switching the item/credit radio.
    let adjDraft = { name: "", itemKey: "", qtyDelta: "", amount: "", grams: "", note: "", gramsHelper: "" };
    // Live preview text for the "按实际重量换算" helper on the 品项数量变化
    // form (see gramsPerUnit below) — recomputed on every keystroke
    // in the grams-helper input, cleared whenever the form resets.
    let adjGramsPreview = "";
    let showBulkPanel = false;
    let bulkError = "";
    // --- Inline per-item editing (stepper / grams / pieces / box-share) ---
    // A faster path than the "+ 调整" form (kept fully intact below) for the
    // common case of correcting one item's quantity. Every one of these
    // still ultimately calls saveAdjustment() with the exact same
    // type:"item" {qtyDelta, amountDelta} shape the old form writes, so
    // it's invisible to everything downstream (effectiveItems, totals,
    // the ledger, undo) which entry came from which UI. State is keyed by
    // `${memberName}::${itemKey}` so multiple items can have independent
    // in-progress edits open at once, unlike the old form's single
    // openAdjustFormFor slot.
    let stepDrafts = {};        // key -> draft qty for the plain +/- stepper, before saving
    let weightEditing = {};     // key -> is the grams/piece editor panel expanded
    let weightDraftGrams = {};  // key -> current grams input text
    let weightUsePieces = {};   // key -> true if using the piece-count entry instead of grams
    let weightDraftPieces = {}; // key -> current piece-count input text (shared by weight-mode's
                                 // piece alternative and plain count-mode's piece-partial editor)
    let fracEditing = {};       // key -> is the box-share calculator expanded
    let fracCalcMode = {};      // key -> "weight" (bunch÷total) or "manual" (type the fraction directly)
    let fracDraftBunch = {};    // key -> bunch weight input text
    let fracDraftTotal = {};    // key -> box total weight input text
    let fracDraftManual = {};   // key -> manual fraction input text
    // Once one member's box-share edit records a box's total weight, the
    // next member sharing that same box gets it pre-filled — session-only
    // (module state, not persisted), purely a convenience default.
    let boxTotalCache = {};
    let bulkDraft = "";

    // Each member's block/unit number, for organizing deliveries — never read
    // by buildMemberMessage() or buildGroupAnnouncement(), so it never ends up
    // in a WeChat message (that restriction is absolute, unlike the rest of
    // this comment). Persistent across every round (not round-scoped like
    // paidStatus/adjustments), stored in its own Firestore doc (see
    // memberUnitsDocRef) and loaded once at boot, not per round. Shown on
    // every member's card (see the `.unitDisplay` line in render()) to
    // anyone who opens the dashboard link — by explicit request, this is NOT
    // gated behind edit mode for *reading*; only *editing* it (via the
    // "🏠 门牌管理" panel) requires the edit PIN.
    let memberUnits = {}; // { name: "block/unit text" }
    let showUnitsPanel = false;
    let unitsDraft = {}; // working copy while the panel is open; committed on "保存"
    let unitsSaveMsg = "";

    let unsubscribePaidState = null;
    let unsubscribePackedState = null;
    let unsubscribeAdjustments = null;
    let storageDebug = ""; // shows a Firestore error inline, if any — no console access needed

    function paidDocRef(dateKey) {
      return doc(db, "paidStatus", dateKey);
    }
    function packedDocRef(dateKey) {
      return doc(db, "packedStatus", dateKey);
    }
    function adjustmentsDocRef(dateKey) {
      return doc(db, "adjustments", dateKey);
    }
    function memberUnitsDocRef() {
      return doc(db, "memberInfo", "directory");
    }

    // Today's date as YYYY-MM-DD in the browser's local time zone — matches
    // the date-string format GROUP_BUYS/manifest.json already use, so a
    // plain string comparison (">=") works without any date parsing.
    function todayDateStr() {
      const d = new Date();
      const pad = n => String(n).padStart(2, "0");
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }

    // Populates roundStatus for every round in GROUP_BUYS — see the comment
    // on `let roundStatus` above for what each value means and its known
    // limitation (base orders only, walk-ins not counted). One-time reads,
    // not live subscriptions: these are for background tab coloring, not
    // for driving the currently-open round's own UI, which already has its
    // own live subscriptions. Runs once at boot; doesn't block the initial
    // render, and re-renders once done so tabs pick up their colors.
    async function refreshRoundStatuses() {
      const today = todayDateStr();
      await Promise.all(GROUP_BUYS.map(async (gb) => {
        if (gb.date >= today) { roundStatus[gb.date] = "future"; return; }
        try {
          const [fileRes, paidSnap] = await Promise.all([
            fetch(noCacheUrl(gb.file), NO_STORE).then(r => (r.ok ? r.json() : null)),
            getDoc(paidDocRef(gb.date)).catch(() => null),
          ]);
          if (!fileRes || !Array.isArray(fileRes.orders)) { roundStatus[gb.date] = "future"; return; }
          const paidData = paidSnap && paidSnap.exists() ? paidSnap.data() : {};
          const hasUnpaid = fileRes.orders.some(o => !paidData[o.name]);
          roundStatus[gb.date] = hasUnpaid ? "pending" : "completed";
        } catch (e) {
          // Leave this round uncolored rather than showing a debug banner
          // over a purely cosmetic feature — the tab still works, it just
          // won't have a status color this load.
          delete roundStatus[gb.date];
        }
      }));
      render();
    }

    function escapeHtml(s) {
      // Escapes ' too (not just & < > "), matching theme.js's canonical
      // version in the Dashboard Template — this local copy was missing it,
      // which matters wherever an escaped value lands inside a
      // single-quoted HTML attribute (none currently do, but the more
      // complete version costs nothing and removes that whole class of gap).
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function resetAdjDraft() {
      adjDraft = { name: "", itemKey: "", qtyDelta: "", amount: "", grams: "", note: "", gramsHelper: "" };
      adjFormType = "item";
      adjFormError = "";
      adjGramsPreview = "";
    }

    // Wipes all in-progress inline-editor state — called on round switch so
    // a half-typed correction on one round's item never leaks into another
    // round's (unrelated) item that happens to share the same member+key.
    function resetInlineEdits() {
      stepDrafts = {};
      weightEditing = {};
      weightDraftGrams = {};
      weightUsePieces = {};
      weightDraftPieces = {};
      fracEditing = {};
      fracCalcMode = {};
      fracDraftBunch = {};
      fracDraftTotal = {};
      fracDraftManual = {};
      boxTotalCache = {};
    }

    // Looks up the best-matching emoji for a product's Chinese label by
    // checking EMOJI_MAP.categories in order and returning the first
    // category whose keywords list contains a substring of the label.
    function productEmoji(label) {
      const cats = EMOJI_MAP.categories || [];
      for (const cat of cats) {
        if ((cat.keywords || []).some(kw => label.includes(kw))) return cat.emoji;
      }
      return EMOJI_MAP.defaultEmoji || "🛒";
    }
    // Product label prefixed with its looked-up emoji, for display only —
    // never used for the underlying data/keys.
    function emojiLabel(info) {
      return `${productEmoji(info.label)} ${info.label}`;
    }

    // Subscribes to live updates for this group buy's paid status. Every
    // change — from this browser or anyone else's — re-renders automatically,
    // so the dashboard stays in sync across everyone with the link.
    function subscribeToPaidState(dateKey) {
      if (unsubscribePaidState) { unsubscribePaidState(); unsubscribePaidState = null; }
      unsubscribePaidState = onSnapshot(
        paidDocRef(dateKey),
        (snap) => {
          paidState = snap.exists() ? snap.data() : {};
          const wasLocked = roundLocked;
          roundLocked = !!paidState.__locked;
          if (roundLocked && !wasLocked) {
            // Round just became locked (from this browser or another one) —
            // back out of edit mode so an adjustment form doesn't stay open
            // on a now-frozen round.
            editMode = false;
            openAdjustFormFor = null;
            showBulkPanel = false;
            showUnitsPanel = false;
          }
          storageDebug = "";
          render();
        },
        (err) => {
          storageDebug = `Firestore 读取出错：${err.message}`;
          paidState = {};
          render();
        }
      );
    }

    // Same live-sync pattern as paid status, for packing progress. Kept in
    // its own collection/doc rather than piggybacking on paidStatus so the
    // two stay independently toggleable and neither write can clobber the
    // other's field.
    function subscribeToPackedState(dateKey) {
      if (unsubscribePackedState) { unsubscribePackedState(); unsubscribePackedState = null; }
      unsubscribePackedState = onSnapshot(
        packedDocRef(dateKey),
        (snap) => {
          packedState = snap.exists() ? snap.data() : {};
          render();
        },
        (err) => {
          storageDebug = `打包状态读取出错：${err.message}`;
          packedState = {};
          render();
        }
      );
    }

    // Same live-sync pattern as paid status, for delivery-day adjustments
    // (shortages, refunds, walk-in extras) — see adjustmentsForMember().
    function subscribeToAdjustments(dateKey) {
      if (unsubscribeAdjustments) { unsubscribeAdjustments(); unsubscribeAdjustments = null; }
      unsubscribeAdjustments = onSnapshot(
        adjustmentsDocRef(dateKey),
        (snap) => {
          adjustments = snap.exists() ? snap.data() : {};
          render();
        },
        (err) => {
          storageDebug = `调整记录读取出错：${err.message}`;
          adjustments = {};
          render();
        }
      );
    }

    // Loads the member block/unit directory once, not per round — it isn't
    // tied to any one group buy's date. Guards on `DATA` before re-rendering
    // since this can resolve before the first round has finished loading at
    // boot (same guard pattern as the emoji-map/message-template fetches).
    function subscribeToMemberUnits() {
      onSnapshot(
        memberUnitsDocRef(),
        (snap) => {
          memberUnits = snap.exists() ? snap.data() : {};
          if (DATA) render();
        },
        (err) => {
          storageDebug = `门牌信息读取出错：${err.message}`;
          if (DATA) render();
        }
      );
    }

    // Writes only the changed name -> unit fields (merge), so editing one
    // member's unit can't clobber another's concurrent edit.
    async function saveMemberUnits(patch) {
      try {
        await setDoc(memberUnitsDocRef(), patch, { merge: true });
        unitsSaveMsg = "已保存 ✓";
      } catch (e) {
        unitsSaveMsg = "";
        storageDebug = `门牌保存出错：${e.message}`;
      }
      render();
    }

    // Writes just the one member's field, so two people tapping different
    // rows at the same time can't clobber each other's change. If marking
    // someone paid is the last outstanding payment for this round, also
    // flips on the shared "__locked" flag in the same write — see the
    // roundLocked comment above for what that freezes.
    async function togglePaid(dateKey, name) {
      if (roundLocked) return; // frozen until unlocked — see handleUnlockSubmit()
      try {
        const newValue = !paidState[name];
        const patch = { [name]: newValue };
        if (newValue) {
          const allNames = allMemberNamesInOrder();
          const willAllBePaid = allNames.length > 0 &&
            allNames.every(n => (n === name ? true : !!paidState[n]));
          if (willAllBePaid) patch.__locked = true;
        }
        await setDoc(paidDocRef(dateKey), patch, { merge: true });
      } catch (e) {
        storageDebug = `保存出错：${e.message}`;
        render();
      }
    }

    // Writes just the one member's packed field. Unlike togglePaid(), never
    // gated on roundLocked — packing is an operational task independent of
    // payment, so it should stay editable even after a round auto-locks.
    async function togglePacked(dateKey, name) {
      try {
        await setDoc(packedDocRef(dateKey), { [name]: !packedState[name] }, { merge: true });
      } catch (e) {
        storageDebug = `打包状态保存出错：${e.message}`;
        render();
      }
    }

    // Clears the shared round lock after the correct edit PIN is entered.
    // Deliberately always asks for the PIN here even if this browser already
    // has editUnlocked=true from a previous session — unlocking a settled
    // round is meant to be a deliberate act each time, not something a
    // remembered device gets to skip.
    async function handleUnlockSubmit(dateKey) {
      if (unlockPinDraft === EDIT_PIN) {
        unlockPinError = "";
        try {
          await setDoc(paidDocRef(dateKey), { __locked: false }, { merge: true });
        } catch (e) {
          storageDebug = `解锁出错：${e.message}`;
        }
        showUnlockPrompt = false;
        unlockPinDraft = "";
      } else {
        unlockPinError = "密码错误";
      }
      render();
    }

    function newEntryId(salt) {
      return `${Date.now()}_${salt != null ? salt + "_" : ""}${Math.random().toString(36).slice(2, 8)}`;
    }

    async function saveAdjustment(dateKey, entry) {
      try {
        await setDoc(adjustmentsDocRef(dateKey), { [newEntryId()]: entry }, { merge: true });
      } catch (e) {
        storageDebug = `调整保存出错：${e.message}`;
        render();
      }
    }

    async function deleteAdjustment(dateKey, id) {
      try {
        await setDoc(adjustmentsDocRef(dateKey), { [id]: deleteField() }, { merge: true });
      } catch (e) {
        storageDebug = `调整删除出错：${e.message}`;
        render();
      }
    }

    async function bulkApplyAdjustments(dateKey, entries) {
      const patch = {};
      entries.forEach((entry, i) => { patch[newEntryId(i)] = entry; });
      try {
        await setDoc(adjustmentsDocRef(dateKey), patch, { merge: true });
      } catch (e) {
        storageDebug = `批量调整出错：${e.message}`;
        render();
      }
    }

    function cost(items) {
      // `price == null` (covers a missing field as well as an explicit
      // `null`) counts as $0, same as a product that doesn't exist at all —
      // otherwise an unverified/placeholder product with no `price` field
      // yet (forgotten, not explicitly `null`) would multiply `undefined *
      // qty` into NaN and poison every total downstream (grand total,
      // collected, per-member totals — none of them would throw, since
      // NaN.toFixed() happily prints "NaN", but every dollar figure on the
      // page would silently read "$NaN" instead of a number).
      return Object.entries(items).reduce((sum, [key, qty]) => {
        const info = DATA.products[key];
        return sum + (info && info.price != null ? info.price * qty : 0);
      }, 0);
    }
    function unitOf(key) {
      return (DATA.products[key] && DATA.products[key].unit) || "盒";
    }

    // Any product priced by weight can have its actual-weight-received
    // measurement (in grams, straight off a scale) converted into the right
    // quantity for the "品项数量变化" field. Two shapes of weight-priced
    // product exist in this data:
    //   - unit: "kg" directly (e.g. 脆甜大荔冬枣, 普罗旺斯番茄) — ordered and
    //     billed by the kilogram, so 1 unit = 1000g, trivially.
    //   - bulk produce sold in pre-weighed bags whose label embeds the pack
    //     weight (e.g. "无籽蜜橘(2kg/包)") — ordered by 包/份/etc., but when
    //     a bag is split between members it's actually portioned out by
    //     weighing rather than by fraction of a bag, so the weight received
    //     doesn't land exactly on the ordered fraction.
    // Either way the admin only ever has a grams reading from a scale, and
    // hand-converting that to kg (easy) or to a fraction of a multi-kg bag
    // (error-prone — see the "无籽蜜橘" mixup that prompted this) shouldn't
    // be necessary. Returns grams-per-unit for either shape, or null when
    // neither applies (count-based items like 盒/份/粒/只/瓶/袋 aren't sold
    // by weight at all and just use the plain qty field) — see the "或输入
    // 实际到手重量（克）" helper in renderAdjForm/handleAdjGramsHelperInput.
    // Returns grams-per-unit for a weight-priced product. Checks an
    // explicit `gramsPerUnit` field on the product first (set deliberately
    // per-product, e.g. in a round's data file's `products` entry — no
    // label-parsing ambiguity possible) before falling back to the
    // original unit==="kg"/regex-on-label logic below, so older round
    // files without the explicit field keep working exactly as before.
    function gramsPerUnit(key) {
      const info = DATA.products[key];
      if (!info) return null;
      if (info.gramsPerUnit != null) return info.gramsPerUnit;
      if (info.unit === "kg") return 1000;
      if (!info.label) return null;
      const m = info.label.match(/\((\d+(?:\.\d+)?)\s*(kg|g)\s*\/[^)]*\)/i);
      if (!m) return null;
      const value = parseFloat(m[1]);
      if (isNaN(value) || value <= 0) return null;
      return m[2].toLowerCase() === "kg" ? value * 1000 : value;
    }

    // How many discrete pieces make up one ordered unit (e.g. 4 for
    // "4粒/份") — an explicit catalog field, never guessed from the label,
    // since "N粒" appearing in a label doesn't by itself say whether a
    // partial/piece-count correction should ever apply to that product.
    function piecesPerUnitFor(key) {
      const info = DATA.products[key];
      return info && info.piecesPerUnit != null ? info.piecesPerUnit : null;
    }

    // Which inline editor a product's line should offer, driven entirely by
    // an explicit `weighMode` field on the product — never inferred from
    // the label. Undefined/missing (the vast majority of products, and
    // every product in a round file that predates this field) defaults
    // cleanly to "count", so older round data just gets the plain stepper
    // with no behavior change. "REVIEW_NEEDED" (a product whose correct
    // classification hasn't been decided yet) also falls through to
    // "count" — safe default until someone resolves it.
    function classify(key) {
      const info = DATA.products[key];
      if (!info) return "count";
      if (info.weighMode === "proportional") return "fraction";
      if (info.weighMode === "weight") return "weight";
      return "count";
    }

    // Business rule for reweighed bulk items: always round the actual weight
    // down to the nearest 100g (in the member's favor) before pricing it.
    function roundGramsDown(grams) {
      return Math.floor(grams / 100) * 100;
    }
    // A product counts as "unverified" (shows 待确认 instead of a dollar
    // amount, everywhere) either because it's explicitly flagged that way,
    // or because its `price` is missing/null — the latter matters because a
    // hand-authored data-<date>.json that simply forgets to write a `price`
    // for a placeholder product (without also remembering to set
    // `unverified: true`) would otherwise silently compute `undefined * qty`
    // → NaN, and show "$NaN" across the card, the totals, and the stocking
    // list instead of a clear "price not set yet" marker.
    function isUnverified(key) {
      const info = DATA.products[key];
      return !!(info && (info.unverified || info.price == null));
    }
    function countUnverifiedLines(members) {
      let n = 0;
      members.forEach(m => Object.keys(m.items).forEach(k => { if (isUnverified(k)) n++; }));
      return n;
    }

    // Guards every adjustment entry against the exact fields the rest of the
    // code assumes are present before doing math or calling .toFixed() on
    // them — a hand-edited Firestore entry, a bad paste into the bulk-import
    // panel some other way, or a future schema change could otherwise leave
    // one malformed entry that crashes rendering for every single visitor
    // (the whole page is one big template string, so one thrown error while
    // building it aborts the entire render — nothing gets displayed or wired
    // up). Anything failing this check is silently excluded from
    // adjustmentsForMember() below rather than ever reaching a `.toFixed()`
    // call; see invalidAdjustmentEntries() below and its use in render()
    // (the `badAdjustments` banner) for how it's surfaced instead of just
    // vanishing unexplained.
    function isValidAdjustmentShape(a) {
      if (!a || typeof a !== "object" || !a.member) return false;
      if (a.type === "weight") return typeof a.actualGrams === "number";
      if (a.type === "item") return typeof a.qtyDelta === "number" && typeof a.amountDelta === "number";
      return typeof a.amountDelta === "number"; // "credit" and anything else
    }

    // All adjustment entries for one member, oldest first.
    function adjustmentsForMember(name) {
      return Object.entries(adjustments)
        .filter(([id, e]) => e && e.member === name && isValidAdjustmentShape(e))
        .map(([id, e]) => ({ id, ...e }))
        .sort((a, b) => (a.ts || 0) - (b.ts || 0));
    }

    // Every malformed entry across the whole round (any member), so it can
    // be surfaced in a banner and cleaned up in one tap instead of silently
    // disappearing with no trace.
    function invalidAdjustmentEntries() {
      return Object.entries(adjustments).filter(([id, e]) => e && e.member && !isValidAdjustmentShape(e));
    }

    async function cleanupInvalidAdjustments(dateKey) {
      const bad = invalidAdjustmentEntries();
      if (!bad.length) return;
      const patch = {};
      bad.forEach(([id]) => { patch[id] = deleteField(); });
      try {
        await setDoc(adjustmentsDocRef(dateKey), patch, { merge: true });
      } catch (e) {
        storageDebug = `清理出错：${e.message}`;
      }
      render();
    }
    // Net dollar effect of a member's adjustments (shortages/refunds/extras).
    function adjustmentTotal(name) {
      return adjustmentsForMember(name).reduce((s, a) => s + (a.amountDelta || 0), 0);
    }
    // A member's original items plus item-type adjustment deltas — used for
    // procurement totals (stocking list, unit totals), never for money, since
    // money is always base cost + amountDelta (frozen at adjustment time).
    function effectiveItems(m) {
      const out = { ...m.items };
      adjustmentsForMember(m.name).forEach(a => {
        if (a.type === "item" && a.itemKey) {
          out[a.itemKey] = (out[a.itemKey] || 0) + a.qtyDelta;
          if (!out[a.itemKey]) delete out[a.itemKey];
        }
      });
      return out;
    }

    // Same idea as effectiveItems() but for one member+item pair, looked up
    // by name rather than requiring the caller already have the rendered
    // member object — used by the grams-helper in the adjustment form so a
    // *second* reweigh correction nets against the already-corrected qty
    // (e.g. base 0.5 + a first correction to 0.6) rather than the original
    // order. Works for walk-ins too (base qty 0, since they have no entry in
    // DATA.orders).
    function currentQtyFor(memberName, itemKey) {
      const base = DATA.orders.find(o => o.name === memberName);
      const baseQty = (base && base.items[itemKey]) || 0;
      const adjQty = adjustmentsForMember(memberName)
        .filter(a => a.type === "item" && a.itemKey === itemKey)
        .reduce((s, a) => s + a.qtyDelta, 0);
      return baseQty + adjQty;
    }

    // ============================================================
    // Inline per-item editors (stepper / grams / pieces / box-share)
    // ============================================================
    // All four ultimately call this one function, which is the exact same
    // computation handleAdjGramsHelperInput/handleAdjSave already do for the
    // old form: delta relative to currentQtyFor (so a second correction
    // composes with the first rather than double-counting), amountDelta at
    // this item's current price, saved as one type:"item" entry. Undo is
    // free — it's just the normal per-adjustment 撤销 on the resulting
    // ledger line, same as any other entry.
    function saveInlineItemAdjustment(memberKey, itemKey, newQty, note) {
      const info = DATA.products[itemKey];
      const current = currentQtyFor(memberKey, itemKey);
      const qtyDelta = Math.round((newQty - current) * 10000) / 10000;
      if (qtyDelta === 0) return;
      const amountDelta = info && info.price != null ? info.price * qtyDelta : 0;
      saveAdjustment(GROUP_BUYS[activeIndex].date, {
        member: memberKey, type: "item", itemKey, qtyDelta, amountDelta, note: note || "", ts: Date.now()
      });
    }

    function inlineKey(memberKey, itemKey) {
      return `${memberKey}::${itemKey}`;
    }

    // Plain count item, no piece count declared — the simple +/- stepper.
    function renderInlineCountStepper(memberKey, itemKey) {
      const key = inlineKey(memberKey, itemKey);
      const current = currentQtyFor(memberKey, itemKey);
      const draft = stepDrafts[key] != null ? stepDrafts[key] : current;
      const dirty = draft !== current;
      return `
        <div class="inlineEditor">
          <div class="stepper">
            <div class="stepBtn" role="button" tabindex="0" data-action="stepDec" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">−</div>
            <div class="stepQty">${formatQty(draft)}</div>
            <div class="stepBtn" role="button" tabindex="0" data-action="stepInc" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">+</div>
          </div>
          ${dirty ? `
            <div class="saveBtn" role="button" tabindex="0" data-action="stepSave" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✓</div>
            <div class="cancelBtn" role="button" tabindex="0" data-action="stepCancel" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✕</div>
          ` : `<div class="voidBtn" role="button" tabindex="0" data-action="stepShortage" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">缺货</div>`}
        </div>
      `;
    }

    // Plain count item WITH a declared piece count — same shape as the
    // weight editor below (one entry button, panel with a quick-缺货
    // action inside), for a damaged/partial order (e.g. 1 of 4 pieces bad).
    function renderInlineCountWithPieces(memberKey, itemKey) {
      const key = inlineKey(memberKey, itemKey);
      const info = DATA.products[itemKey];
      const piecesPerUnit = piecesPerUnitFor(itemKey);
      const current = currentQtyFor(memberKey, itemKey);
      const totalPieces = Math.round(current * piecesPerUnit * 10000) / 10000;
      if (!weightEditing[key]) {
        return `
          <div class="inlineEditor">
            ${renderInlineCountStepper(memberKey, itemKey)}
            <div class="voidBtn" role="button" tabindex="0" data-action="pieceOpen" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">实际到货颗数</div>
          </div>
        `;
      }
      const draft = weightDraftPieces[key] || "";
      const pieces = parseFloat(draft);
      let preview = "", error = "", ready = false;
      if (!isNaN(pieces) && pieces >= 0) {
        if (pieces > totalPieces) {
          error = `⚠️ 实收颗数（${formatQty(pieces)}）比订购的总颗数（${formatQty(totalPieces)}）还多，检查一下是不是填错了`;
        } else {
          const newQty = Math.round((pieces / piecesPerUnit) * 10000) / 10000;
          const delta = Math.round((newQty - current) * 10000) / 10000;
          const amt = info && info.price != null ? delta * info.price : null;
          preview = `${formatQty(pieces)}/${formatQty(totalPieces)}粒 → ${formatQty(newQty)}${unitOf(itemKey)}（${delta === 0 ? "无变化" : (delta < 0 ? "少" : "多") + formatQty(Math.abs(delta)) + unitOf(itemKey)}${amt == null ? "" : ` ≈ ${amt >= 0 ? "+" : "-"}$${Math.abs(amt).toFixed(2)}`}）`;
          ready = true;
        }
      }
      return `
        <div class="inlineEditor">
          <input type="number" class="numInput" id="pieceInput-${escapeHtml(key)}" placeholder="实收颗数（共${formatQty(totalPieces)}粒）" value="${escapeHtml(draft)}" data-action="pieceInput" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">
          <div class="voidBtn" role="button" tabindex="0" data-action="pieceShortage" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}" style="border-color:var(--red);color:var(--red)">缺货（0颗）</div>
          <div class="cancelBtn" role="button" tabindex="0" data-action="pieceCancel" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✕ 取消</div>
          ${ready ? `<div class="saveBtn" role="button" tabindex="0" data-action="pieceSave" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✓ 保存</div>` : ""}
        </div>
        ${preview ? `<div class="inlinePreview">${preview}</div>` : ""}
        ${error ? `<div class="inlineError">${error}</div>` : ""}
      `;
    }

    // Weight-priced item — grams input converted via gramsPerUnit, rounded
    // down to the nearest 100g in the member's favor (same rule the old
    // form's gramsHelper already applies). If the product also declares a
    // piece count, offers "没有秤？改用数颗数" as an alternate no-scale
    // entry method (e.g. splitting a box of pears evenly by counting).
    function renderInlineWeight(memberKey, itemKey) {
      const key = inlineKey(memberKey, itemKey);
      const info = DATA.products[itemKey];
      const perUnit = gramsPerUnit(itemKey);
      const piecesPerUnit = piecesPerUnitFor(itemKey);
      const current = currentQtyFor(memberKey, itemKey);
      if (!weightEditing[key]) {
        return `<div class="inlineEditor"><div class="voidBtn" role="button" tabindex="0" data-action="weightOpen" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">实际到货克数</div></div>`;
      }
      if (weightUsePieces[key] && piecesPerUnit) {
        const totalPieces = Math.round(current * piecesPerUnit * 10000) / 10000;
        const draft = weightDraftPieces[key] || "";
        const pieces = parseFloat(draft);
        let preview = "", error = "", ready = false;
        if (!isNaN(pieces) && pieces >= 0) {
          if (pieces > totalPieces) {
            error = `⚠️ 实收颗数（${formatQty(pieces)}）比订购的总颗数（${formatQty(totalPieces)}）还多，检查一下是不是填错了`;
          } else {
            const newQty = Math.round((pieces / piecesPerUnit) * 10000) / 10000;
            const delta = Math.round((newQty - current) * 10000) / 10000;
            const amt = info && info.price != null ? delta * info.price : null;
            preview = `${formatQty(pieces)}/${formatQty(totalPieces)}粒 → ${formatQty(newQty)}${unitOf(itemKey)}（${delta === 0 ? "无变化" : (delta < 0 ? "少" : "多") + formatQty(Math.abs(delta)) + unitOf(itemKey)}${amt == null ? "" : ` ≈ ${amt >= 0 ? "+" : "-"}$${Math.abs(amt).toFixed(2)}`}）`;
            ready = true;
          }
        }
        return `
          <div class="inlineEditor">
            <input type="number" class="numInput" id="wPieceInput-${escapeHtml(key)}" placeholder="实收颗数（共${formatQty(totalPieces)}粒）" value="${escapeHtml(draft)}" data-action="weightPieceInput" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">
            <div class="cancelBtn" role="button" tabindex="0" data-action="weightCancel" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✕ 取消</div>
            ${ready ? `<div class="saveBtn" role="button" tabindex="0" data-action="weightPieceSave" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✓ 保存</div>` : ""}
          </div>
          <div class="inlineEditor"><div class="voidBtn" role="button" tabindex="0" data-action="weightToGrams" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">← 改用填克数</div></div>
          ${preview ? `<div class="inlinePreview">${preview}</div>` : ""}
          ${error ? `<div class="inlineError">${error}</div>` : ""}
        `;
      }
      const draft = weightDraftGrams[key] || "";
      const grams = parseFloat(draft);
      let preview = "", ready = false;
      if (perUnit && !isNaN(grams) && grams > 0) {
        const rounded = roundGramsDown(grams);
        const newQty = rounded / perUnit;
        const delta = Math.round((newQty - current) * 10000) / 10000;
        const amt = info && info.price != null ? delta * info.price : null;
        preview = `实收${formatQty(grams)}g → 按100g向下取整为${formatQty(rounded)}g = ${formatQty(newQty)}${unitOf(itemKey)}（原${formatQty(current)}${unitOf(itemKey)}，差${delta >= 0 ? "+" : ""}${formatQty(delta)}${unitOf(itemKey)}${amt == null ? "" : ` ≈ ${amt >= 0 ? "+" : "-"}$${Math.abs(amt).toFixed(2)}`}）`;
        ready = true;
      }
      return `
        <div class="inlineEditor">
          <input type="number" class="numInput" id="gramsInput-${escapeHtml(key)}" placeholder="实际到手重量（克）" value="${escapeHtml(draft)}" data-action="weightInput" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">
          <div class="voidBtn" role="button" tabindex="0" data-action="weightShortage" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}" style="border-color:var(--red);color:var(--red)">缺货（0g）</div>
          <div class="cancelBtn" role="button" tabindex="0" data-action="weightCancel" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✕ 取消</div>
          ${ready ? `<div class="saveBtn" role="button" tabindex="0" data-action="weightSave" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✓ 保存</div>` : ""}
        </div>
        ${piecesPerUnit ? `<div class="inlineEditor"><div class="voidBtn" role="button" tabindex="0" data-action="weightToPieces" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">没有秤？改用数颗数（共${formatQty(Math.round(current * piecesPerUnit * 10000) / 10000)}粒）→</div></div>` : ""}
        ${preview ? `<div class="inlinePreview">${preview}</div>` : ""}
      `;
    }

    // Box shared by weight with no single fixed total (e.g. a grape box
    // whose bunches each weigh differently) — bunch÷total calculator, with
    // a manual-fraction fallback for anything without a scale involved.
    // Validates that a portion can't outweigh the box it came from — the
    // exact mistake ($84 from an over-entered portion) that prompted this.
    function renderInlineFraction(memberKey, itemKey) {
      const key = inlineKey(memberKey, itemKey);
      const info = DATA.products[itemKey];
      const current = currentQtyFor(memberKey, itemKey);
      if (!fracEditing[key]) {
        return `<div class="inlineEditor"><div class="voidBtn" role="button" tabindex="0" data-action="fracOpen" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">改比例</div></div>`;
      }
      if (fracCalcMode[key] === "manual") {
        const draft = fracDraftManual[key] || "";
        const ready = draft !== "" && !isNaN(parseFloat(draft));
        return `
          <div class="inlineEditor">
            <input type="number" step="any" class="numInput" id="fracManual-${escapeHtml(key)}" placeholder="新比例，例如 0.5" value="${escapeHtml(draft)}" data-action="fracManualInput" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">
            <div class="voidBtn" role="button" tabindex="0" data-action="fracToWeight" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">改用净重计算 →</div>
            <div class="cancelBtn" role="button" tabindex="0" data-action="fracCancel" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✕ 取消</div>
            ${ready ? `<div class="saveBtn" role="button" tabindex="0" data-action="fracManualSave" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✓ 保存</div>` : ""}
          </div>
        `;
      }
      const cachedTotal = boxTotalCache[itemKey];
      if (fracDraftTotal[key] == null && cachedTotal) fracDraftTotal[key] = String(cachedTotal);
      const bunchDraft = fracDraftBunch[key] || "";
      const totalDraft = fracDraftTotal[key] || "";
      const bunch = parseFloat(bunchDraft);
      const total = parseFloat(totalDraft);
      let preview = "", error = "", ready = false;
      if (!isNaN(bunch) && !isNaN(total) && total > 0 && bunch >= 0) {
        if (bunch > total) {
          error = `⚠️ 这份净重（${formatQty(bunch)}g）比全箱总重（${formatQty(total)}g）还重，检查一下是不是填反了，或者总重量错了`;
        } else {
          const frac = Math.round((bunch / total) * 10000) / 10000;
          const delta = Math.round((frac - current) * 10000) / 10000;
          const amt = info && info.price != null ? delta * info.price : null;
          preview = `${formatQty(bunch)}g ÷ ${formatQty(total)}g = ${(frac * 100).toFixed(1)}% → ${formatQty(frac)}（原比例${formatQty(current)}，${delta === 0 ? "无变化" : (delta < 0 ? "少" : "多") + formatQty(Math.abs(delta))}${amt == null ? "" : ` ≈ ${amt >= 0 ? "+" : "-"}$${Math.abs(amt).toFixed(2)}`}）`;
          ready = true;
        }
      }
      return `
        <div class="inlineEditor">
          <input type="number" step="any" class="numInput" id="fracBunch-${escapeHtml(key)}" placeholder="这份净重（克）" value="${escapeHtml(bunchDraft)}" data-action="fracBunchInput" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">
          <input type="number" step="any" class="numInput" id="fracTotal-${escapeHtml(key)}" placeholder="全箱总重（克）" value="${escapeHtml(totalDraft)}" data-action="fracTotalInput" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">
        </div>
        <div class="inlineEditor">
          <div class="voidBtn" role="button" tabindex="0" data-action="fracToManual" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">改用直接输入比例 →</div>
          <div class="cancelBtn" role="button" tabindex="0" data-action="fracCancel" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✕ 取消</div>
          ${ready ? `<div class="saveBtn" role="button" tabindex="0" data-action="fracCalcSave" data-member="${escapeHtml(memberKey)}" data-item="${itemKey}">✓ 保存</div>` : ""}
        </div>
        ${preview ? `<div class="inlinePreview">${preview}</div>` : ""}
        ${error ? `<div class="inlineError">${error}</div>` : ""}
      `;
    }

    // Dispatches to the right editor for one item line, based on the
    // product's declared weighMode/piecesPerUnit. Returns just the inner
    // markup (no wrapper) — renderInlineEditorFor above wraps this in the
    // stable id'd container; refreshInlineArea below writes straight back
    // into that same container's innerHTML on a keystroke, without it.
    function renderInlineEditorInner(memberKey, itemKey) {
      const mode = classify(itemKey);
      if (mode === "fraction") return renderInlineFraction(memberKey, itemKey);
      if (mode === "weight") return renderInlineWeight(memberKey, itemKey);
      if (piecesPerUnitFor(itemKey)) return renderInlineCountWithPieces(memberKey, itemKey);
      return renderInlineCountStepper(memberKey, itemKey);
    }

    // Wraps the above in a stable container (id derived from member+item)
    // so a keystroke in one of this editor's live-preview inputs can
    // refresh just this one small area instead of the whole page — see
    // refreshInlineArea below for why that matters (same reason the old
    // form's grams-helper avoids render() on every keystroke: a full
    // render() rebuilds the entire page and would tear down whichever
    // input the person is mid-keystroke in).
    function renderInlineEditorFor(memberKey, itemKey) {
      return `<div class="inlineEditorArea" id="ie-${escapeHtml(inlineKey(memberKey, itemKey))}">${renderInlineEditorInner(memberKey, itemKey)}</div>`;
    }

    // Attaches every inline-editor click/input listener found under `root`
    // — called once for the whole page after a normal render(), and again
    // for just one small container after refreshInlineArea() patches it
    // (since replacing innerHTML wipes any listeners the old nodes had).
    function bindInlineEditorArea(root) {
      const inlineClickActions = new Set([
        "stepDec", "stepInc", "stepSave", "stepCancel", "stepShortage",
        "pieceOpen", "pieceCancel", "pieceSave", "pieceShortage",
        "weightOpen", "weightCancel", "weightSave", "weightShortage",
        "weightToPieces", "weightToGrams", "weightPieceSave",
        "fracOpen", "fracCancel", "fracToManual", "fracToWeight",
        "fracManualSave", "fracCalcSave",
      ]);
      root.querySelectorAll("[data-action]").forEach(el => {
        const action = el.dataset.action;
        if (inlineClickActions.has(action)) {
          el.addEventListener("click", () => {
            const memberKey = el.dataset.member;
            const itemKey = el.dataset.item;
            const key = inlineKey(memberKey, itemKey);
            const current = currentQtyFor(memberKey, itemKey);
            if (action === "stepDec") stepDrafts[key] = Math.max(0, (stepDrafts[key] != null ? stepDrafts[key] : current) - 1);
            if (action === "stepInc") stepDrafts[key] = (stepDrafts[key] != null ? stepDrafts[key] : current) + 1;
            if (action === "stepCancel") delete stepDrafts[key];
            if (action === "stepSave") {
              saveInlineItemAdjustment(memberKey, itemKey, stepDrafts[key], "");
              delete stepDrafts[key];
            }
            if (action === "stepShortage") saveInlineItemAdjustment(memberKey, itemKey, 0, "缺货");
            if (action === "pieceOpen") { weightEditing[key] = true; weightDraftPieces[key] = ""; }
            if (action === "pieceCancel") { weightEditing[key] = false; delete weightDraftPieces[key]; }
            if (action === "pieceShortage") {
              saveInlineItemAdjustment(memberKey, itemKey, 0, "缺货");
              weightEditing[key] = false; delete weightDraftPieces[key];
            }
            if (action === "pieceSave") {
              const piecesPerUnit = piecesPerUnitFor(itemKey);
              const pieces = parseFloat(weightDraftPieces[key]);
              const totalPieces = Math.round(current * piecesPerUnit * 10000) / 10000;
              if (!isNaN(pieces) && pieces >= 0 && pieces <= totalPieces) {
                saveInlineItemAdjustment(memberKey, itemKey, pieces / piecesPerUnit, `实收${formatQty(pieces)}/${formatQty(totalPieces)}粒`);
              }
              weightEditing[key] = false; delete weightDraftPieces[key];
            }
            if (action === "weightOpen") { weightEditing[key] = true; weightUsePieces[key] = false; weightDraftGrams[key] = ""; }
            if (action === "weightCancel") { weightEditing[key] = false; delete weightDraftGrams[key]; delete weightDraftPieces[key]; }
            if (action === "weightShortage") {
              saveInlineItemAdjustment(memberKey, itemKey, 0, "缺货");
              weightEditing[key] = false; delete weightDraftGrams[key];
            }
            if (action === "weightSave") {
              const perUnit = gramsPerUnit(itemKey);
              const grams = parseFloat(weightDraftGrams[key]);
              if (perUnit && !isNaN(grams) && grams > 0) {
                const rounded = roundGramsDown(grams);
                saveInlineItemAdjustment(memberKey, itemKey, rounded / perUnit, `实收${formatQty(rounded)}g`);
              }
              weightEditing[key] = false; delete weightDraftGrams[key];
            }
            if (action === "weightToPieces") { weightUsePieces[key] = true; weightDraftPieces[key] = ""; }
            if (action === "weightToGrams") { weightUsePieces[key] = false; weightDraftGrams[key] = ""; }
            if (action === "weightPieceSave") {
              const piecesPerUnit = piecesPerUnitFor(itemKey);
              const pieces = parseFloat(weightDraftPieces[key]);
              const totalPieces = Math.round(current * piecesPerUnit * 10000) / 10000;
              if (!isNaN(pieces) && pieces >= 0 && pieces <= totalPieces) {
                saveInlineItemAdjustment(memberKey, itemKey, pieces / piecesPerUnit, `实收${formatQty(pieces)}/${formatQty(totalPieces)}粒`);
              }
              weightEditing[key] = false; delete weightDraftPieces[key];
            }
            if (action === "fracOpen") { fracEditing[key] = true; fracCalcMode[key] = "weight"; fracDraftBunch[key] = ""; fracDraftTotal[key] = boxTotalCache[itemKey] ? String(boxTotalCache[itemKey]) : ""; }
            if (action === "fracCancel") { fracEditing[key] = false; delete fracDraftBunch[key]; delete fracDraftTotal[key]; delete fracDraftManual[key]; }
            if (action === "fracToManual") { fracCalcMode[key] = "manual"; fracDraftManual[key] = ""; }
            if (action === "fracToWeight") { fracCalcMode[key] = "weight"; fracDraftBunch[key] = ""; fracDraftTotal[key] = boxTotalCache[itemKey] ? String(boxTotalCache[itemKey]) : ""; }
            if (action === "fracManualSave") {
              const v = parseFloat(fracDraftManual[key]);
              if (!isNaN(v) && v >= 0) saveInlineItemAdjustment(memberKey, itemKey, v, "");
              fracEditing[key] = false; delete fracDraftManual[key];
            }
            if (action === "fracCalcSave") {
              const bunch = parseFloat(fracDraftBunch[key]);
              const total = parseFloat(fracDraftTotal[key]);
              if (!isNaN(bunch) && !isNaN(total) && total > 0 && bunch <= total) {
                boxTotalCache[itemKey] = total;
                saveInlineItemAdjustment(memberKey, itemKey, bunch / total, `净重${formatQty(bunch)}g/总重${formatQty(total)}g`);
              }
              fracEditing[key] = false; delete fracDraftBunch[key]; delete fracDraftTotal[key];
            }
            render();
          });
          return;
        }
        if (el.tagName === "INPUT") {
          el.addEventListener("input", () => {
            const memberKey = el.dataset.member;
            const itemKey = el.dataset.item;
            const key = inlineKey(memberKey, itemKey);
            if (action === "pieceInput") weightDraftPieces[key] = el.value;
            else if (action === "weightPieceInput") weightDraftPieces[key] = el.value;
            else if (action === "weightInput") weightDraftGrams[key] = el.value;
            else if (action === "fracManualInput") fracDraftManual[key] = el.value;
            else if (action === "fracBunchInput") fracDraftBunch[key] = el.value;
            else if (action === "fracTotalInput") fracDraftTotal[key] = el.value;
            else return;
            refreshInlineArea(memberKey, itemKey, el);
          });
        }
      });
    }

    // Patches just one item's inline-editor container after a keystroke —
    // deliberately not a full render(), which would tear down and recreate
    // every input on the page (including whichever one the person is
    // actively typing in) and throw focus/cursor position away. Restores
    // focus and cursor position to the same input afterward, and rebinds
    // listeners on the freshly-created nodes (innerHTML replacement wipes
    // whatever listeners the old ones had).
    function refreshInlineArea(memberKey, itemKey, focusedEl) {
      const container = document.getElementById(`ie-${inlineKey(memberKey, itemKey)}`);
      if (!container) return;
      const focusedAction = focusedEl ? focusedEl.dataset.action : null;
      const selStart = focusedEl ? focusedEl.selectionStart : null;
      const selEnd = focusedEl ? focusedEl.selectionEnd : null;
      container.innerHTML = renderInlineEditorInner(memberKey, itemKey);
      bindInlineEditorArea(container);
      if (focusedAction) {
        const toFocus = container.querySelector(`[data-action="${focusedAction}"]`);
        if (toFocus) {
          toFocus.focus();
          if (selStart != null && toFocus.setSelectionRange) {
            try { toFocus.setSelectionRange(selStart, selEnd); } catch (e) { /* input type doesn't support it — fine to skip */ }
          }
        }
      }
    }


    // Fills {placeholders} in a MESSAGE_TEMPLATE string with values. Missing
    // keys become "" rather than throwing, so a template file that's missing
    // a field degrades gracefully instead of breaking the whole message.
    function fillTemplate(tpl, vars) {
      return String(tpl).replace(/\{(\w+)\}/g, (_, k) => (vars[k] != null ? vars[k] : ""));
    }

    // Money for the copy-message, trimmed of trailing zeros and with no "$" —
    // matches how this group already writes these messages by hand (e.g.
    // "16", "6.7", not "$16.00", "$6.70").
    function formatAmt(x) {
      // Number(x) first: x is normally already a real number here, but this
      // is cheap insurance against a stray string sneaking in (`x.toFixed`
      // doesn't exist on strings and would throw) — see the matching note on
      // formatQty() below, which is at more direct risk since its input
      // often comes straight from hand-authored data-<date>.json.
      return Number(Number(x).toFixed(2)).toString();
    }

    // The "actual weight" note for one member's item, if one was recorded —
    // see the "实际到手重量" adjustment type. Purely informational (never
    // affects money or the stocking list), for items that get portioned out
    // by hand and don't always land on the ordered amount; billing is left
    // as-is (rounded down) but the buyer is still told what they actually got.
    function actualWeightFor(memberName, itemKey) {
      return adjustmentsForMember(memberName).find(a => a.type === "weight" && a.itemKey === itemKey);
    }

    // Builds the plain-text WeChat message for one member — their itemized
    // order, any shortage/refund/extra adjustments (with the reason, so the
    // total doesn't look arbitrary), and the final amount due. Meant to be
    // copied and pasted straight into a WeChat DM or the group chat; never
    // sent automatically, so it's fine if the organizer wants to hand-edit
    // it (e.g. to append payment/QR info) before sending.
    //
    // All ITEM DATA (product names/prices/adjustments/totals/actual weights)
    // comes from data-*.json and Firestore, same as everywhere else on the
    // page. Only the WORDING around that data — the greeting, line phrasing,
    // and closing lines — comes from message-template.json (MESSAGE_TEMPLATE
    // below), so changing how the message reads is a JSON edit, not an
    // index.html edit. (Unlike everywhere else on the page, this message
    // intentionally omits the emoji icons — matches how this group already
    // writes these messages by hand.)
    function buildMemberMessage(m) {
      const t = MESSAGE_TEMPLATE;
      const lines = [];
      lines.push(fillTemplate(t.greeting, { name: m.name }));
      lines.push("");
      Object.entries(m.items).forEach(([k, qty]) => {
        const info = DATA.products[k];
        if (!info) return;
        const unverified = isUnverified(k);
        const amount = unverified ? t.unverifiedAmount : formatAmt(info.price * qty);
        // Weight-priced items (e.g. "2kg of peaches") never show "x2kg" here —
        // the dollar amount already reflects the ordered weight, and the
        // actual weight received (if recorded, see below) is shown instead.
        // Only box-count items ("x2盒") get a quantity suffix.
        const unit = unitOf(k);
        const qtySuffix = (qty !== 1 && unit !== "kg") ? ` x${formatQty(qty)}${unit}` : "";
        const weightEntry = actualWeightFor(m.name, k);
        const weightSuffix = (weightEntry && !unverified)
          ? fillTemplate(t.weightSuffix, { grams: formatQty(weightEntry.actualGrams) })
          : "";
        let line = fillTemplate(t.itemLine, { item: info.label, qtySuffix, amount, weightSuffix });
        if (unverified) line += t.unverifiedSuffix;
        lines.push(line);
      });
      adjustmentsForMember(m.name).forEach(a => {
        if (a.type === "weight") return; // shown inline on the item's own line above, not as its own line
        const sign = a.amountDelta >= 0 ? "+" : "";
        const amount = `${sign}${formatAmt(a.amountDelta)}`;
        if (a.type === "item" && a.itemKey && DATA.products[a.itemKey]) {
          const info = DATA.products[a.itemKey];
          const qtySign = a.qtyDelta >= 0 ? "+" : "";
          const noteSuffix = a.note ? fillTemplate(t.adjNoteSuffix, { note: a.note }) : "";
          lines.push(fillTemplate(t.adjItemLine, {
            item: info.label, qtySign, qty: formatQty(a.qtyDelta), unit: unitOf(a.itemKey), noteSuffix, amount
          }));
        } else {
          lines.push(fillTemplate(t.adjOtherLine, { note: a.note || t.adjDefaultNote, amount }));
        }
      });
      lines.push("");
      lines.push(fillTemplate(t.totalLine, { total: formatAmt(m.total) }));
      const closing = paidState[m.name] ? t.closingPaid : t.closingUnpaid;
      if (closing) lines.push(closing);
      return lines.join("\n");
    }

    // Every member's name for the current round, in 接龙 order — original
    // orders first (as written in data-<date>.json), then anyone who only
    // shows up via a walk-in adjustment. Same order render() uses for the
    // member cards, factored out here so the announcement button (and the
    // round auto-lock check in togglePaid) don't need render()'s full
    // member/cost computation just to list names.
    function allMemberNamesInOrder() {
      const baseNames = DATA.orders.map(o => o.name);
      // `a &&` guards against a malformed (e.g. null) Firestore entry — see
      // the matching comment in render() where the same pattern is used.
      const walkinNames = Array.from(new Set(
        Object.values(adjustments)
          .map(a => a && a.member)
          .filter(name => name && !baseNames.includes(name))
      ));
      return [...baseNames, ...walkinNames];
    }

    // Builds the "everyone can come collect" group announcement: an @mention
    // for every member (so it reads the same way this group already posts
    // it), a blank line, then a short note on where to pick up and what to
    // do if delivery is needed instead. Unlike buildMemberMessage, this is
